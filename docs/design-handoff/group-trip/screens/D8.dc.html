<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>D8 發起集合表單</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Kaku Gothic ProN","Noto Sans CJK TC",sans-serif;color:#1e0d12;-webkit-font-smoothing:antialiased}
.ttl{font-size:21px;font-weight:800;letter-spacing:.02em;line-height:1.2}
.sub{font-size:12px;opacity:.85;margin-top:3px;letter-spacing:.04em}
.cd{background:rgba(255,255,255,.22);border-radius:14px;padding:8px 14px;text-align:center;flex-shrink:0}
.pill{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 11px;font-size:12px}
.flabel{font-size:12px;font-weight:700;color:#5c3347;margin-bottom:6px;letter-spacing:.04em}
.finput{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;font-size:16px;font-family:inherit;color:#1e0d12;background:#fff}
.finput::placeholder{color:#b49aa4}
.mp{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:#fff;color:#5c3347;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;min-height:40px}
.gp{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;min-height:40px}
.gd{width:6px;height:6px;border-radius:50%}
.gt{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 8px 1px 6px;font-size:11px;font-weight:700;line-height:1.6;white-space:nowrap;border:none;font-family:inherit}
.lnk{background:none;border:none;padding:6px 0;min-height:32px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.btn{border:none;border-radius:12px;padding:13px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.nav{height:60px;background:#fff;display:flex;flex-shrink:0;border-top:1px solid #f0e4e4}
.nb{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:10px;font-family:inherit;color:#9a7080}
.nb svg{width:24px;height:24px}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: {{bg}}">
  <div style="color: #fff; padding: 14px 20px 18px; flex-shrink: 0; background: linear-gradient(145deg, {{p}} 0%, {{p2}} 55%, {{p3}} 100%)">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div><div class="ttl">九州・屋久島之旅 2026</div><div class="sub">鹿兒島・福岡・屋久島</div></div>
      <div class="cd"><div style="font-size: 20px; font-weight: 900; line-height: 1.1">旅途中</div><div style="font-size: 10px; opacity: .9; margin-top: 2px">🌸</div></div>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap"><span class="pill">2026年11月1－13日</span><span class="pill">13天12夜</span><span class="pill">4人同行</span></div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px 0">
    <div style="background: #fff; border-radius: 18px; padding: 20px 16px; box-shadow: 0 2px 12px rgba(30,13,18,.06); display: flex; flex-direction: column; gap: 14px">
      <div style="font-size: 15px; font-weight: 700">設定集合時間</div>
      <div>
        <div class="flabel">集合時間</div>
        <input class="finput" type="text" value="17:30" aria-label="集合時間" style="border: 1.5px solid {{pale}}">
      </div>
      <div>
        <div class="flabel">通知誰</div>
        <div role="radiogroup" aria-label="通知誰" style="display: flex; flex-wrap: wrap; gap: 8px">
          <button class="mp" role="radio" aria-checked="true" style="background: {{p}}; color: #fff; border: 1.5px solid {{p}}">鹿兒島組 <span style="opacity: .9">🐱🐻</span></button>
          <button class="mp" role="radio" aria-checked="false" style="border: 1.5px solid {{pale}}">福岡組 <span>🐟🦌</span></button>
          <button class="mp" role="radio" aria-checked="false" style="border: 1.5px solid {{pale}}">全員</button>
          <button class="mp" role="radio" aria-checked="false" style="border: 1.5px solid {{pale}}">自己選</button>
        </div>
      </div>
      <div>
        <div class="flabel">備註（選填）</div>
        <input class="finput" type="text" placeholder="例：在 7-11 旁邊等" aria-label="備註" value="霧島神宮 鳥居前" style="border: 1.5px solid {{pale}}">
      </div>
      <div>
        <div class="flabel">你的名字（選填）</div>
        <input class="finput" type="text" placeholder="例：Claire" aria-label="你的名字" value="小貓" style="border: 1.5px solid {{pale}}">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 2px">
        <button class="btn" style="background: #fff; color: #5c3347; border: 1.5px solid {{pale}}">取消</button>
        <button class="btn" style="flex: 1; background: #f59e0b; color: #fff">🔔 送出通知</button>
      </div>
      <div style="font-size: 12px; color: #7a6a70; line-height: 1.5">💡 送出後會請求通知權限。請保持此頁面在瀏覽器中開著，集合時間到時會響鈴並震動。</div>
    </div>
  </div>

  <nav class="nav">
    <button class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span>行程</span></button>
    <button class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path><rect x="9" y="3" width="6" height="4" rx="1"></rect><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="13" y2="16"></line></svg><span>清單</span></button>
    <button class="nb" style="color: {{p}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span>集合</span></button>
    <button class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"></rect><path d="M16 13h2"></path><path d="M2 10h20"></path></svg><span>記帳</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["赭紅","抹茶綠","湖水綠","櫻花粉","靛藍","藤紫","琥珀黃"],"default":"赭紅"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {'赭紅':['#a8362f','#c45a4f','#e3a89c','#faf2ec','#f3e3d8',3],'抹茶綠':['#5d7242','#7d8f5d','#b5c193','#f3f2e6','#e2e3c8',86],'湖水綠':['#2e6e72','#4f9094','#94b8b9','#edf3f2','#d4e1de',184],'櫻花粉':['#a6586a','#c87d8a','#e3b6bb','#faf0ee','#f1d8da',346],'靛藍':['#2c456c','#4d6791','#92a4c2','#ecf0f6','#d4dde9',217],'藤紫':['#6a5897','#8a7ab2','#b8aed1','#f0eef6','#ddd8e8',257],'琥珀黃':['#b8842a','#d4a04c','#e8c98a','#f7f0dd','#ecdcb6',38]};
    const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const t = TH[this.props.theme ?? '赭紅'] || TH['赭紅'];
    const deep = '#' + hx(t[0]).map((v, i) => Math.round(v * 0.65 + hx('#1e0d12')[i] * 0.35).toString(16).padStart(2, '0')).join('');
    return { p: t[0], p2: t[1], p3: t[2], bg: t[3], pale: t[4], deep: deep };
  }
}
</script>
</body>
</html>
