<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>組名標籤配色（主題深淺版）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.wrap{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC",sans-serif;color:#1e0d12;-webkit-font-smoothing:antialiased}
.row{display:grid;grid-template-columns:180px repeat(4,minmax(0,1fr));gap:8px;align-items:stretch}
.hcell{font-size:13px;font-weight:700;color:#5c3347;display:flex;flex-direction:column;gap:2px;justify-content:flex-end}
.hsub{font-size:12px;font-weight:500;color:#7a6a70}
.cell{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-height:62px;box-sizing:border-box}
.gt{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 8px 1px 6px;font-size:11px;font-weight:700;line-height:1.6;white-space:nowrap}
.gd{width:6px;height:6px;border-radius:50%}
.tt{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.cr{font-size:12px;color:#5c3347;font-variant-numeric:tabular-nums}
.bad{color:#a11d1d;font-weight:700}
</style>
</helmet>
<div class="wrap" style="width: 1120px; min-height: 720px; box-sizing: border-box; background: #fff; padding: 32px; display: flex; flex-direction: column; gap: 10px">
  <div style="font-size: 22px; font-weight: 800">組名標籤：主題深淺版，上限 3 組</div>
  <div style="font-size: 14px; color: #5c3347; line-height: 1.6; margin-bottom: 10px">字色與框線用「主題主色加深 35%」（混入 App 本文色 #1e0d12）。三組靠外觀區分：實心、外框、淡底加框。淡底不加框的樣子保留給時間標籤，所以時間標籤不必改，沒分組的行程畫面不變。</div>

  <div class="row" style="margin-bottom: 4px">
    <div class="hcell">主題</div>
    <div class="hcell">第 1 組<span class="hsub">實心：白字／深底</span></div>
    <div class="hcell">第 2 組<span class="hsub">外框：深字／白底</span></div>
    <div class="hcell">第 3 組<span class="hsub">淡底加框：深字／淡底</span></div>
    <div class="hcell">時間標籤（現況，不改）<span class="hsub">主色字／淡底</span></div>
  </div>

  <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
    <div class="row">
      <div class="cell" style="background: {{r.bg}}; flex-direction: row; align-items: center; gap: 10px">
        <span style="width: 22px; height: 22px; border-radius: 6px; background: {{r.p}}; flex-shrink: 0"></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{r.name}}</span><span style="font-size: 11px; color: #7a6a70; font-family: ui-monospace, Menlo, monospace">深 {{r.deep}}</span></span>
      </div>
      <div class="cell" style="background: #fff; box-shadow: 0 0 0 1px {{r.pale}} inset">
        <span class="gt" style="background: {{r.deep}}; color: #fff"><span class="gd" style="background: #fff"></span>鹿兒島組</span>
        <span class="cr">{{r.c1}}:1</span>
      </div>
      <div class="cell" style="background: #fff; box-shadow: 0 0 0 1px {{r.pale}} inset">
        <span class="gt" style="background: #fff; color: {{r.deep}}; box-shadow: 0 0 0 1.5px {{r.deep}} inset"><span class="gd" style="background: {{r.deep}}"></span>福岡組</span>
        <span class="cr">{{r.c2}}:1</span>
      </div>
      <div class="cell" style="background: #fff; box-shadow: 0 0 0 1px {{r.pale}} inset">
        <span class="gt" style="background: {{r.pale}}; color: {{r.deep}}; box-shadow: 0 0 0 1.5px {{r.deep}} inset"><span class="gd" style="background: {{r.deep}}"></span>長崎組</span>
        <span class="cr">{{r.c3}}:1</span>
      </div>
      <div class="cell" style="background: #fff; box-shadow: 0 0 0 1px {{r.pale}} inset">
        <span class="tt" style="background: {{r.pale}}; color: {{r.p}}">10:20</span>
        <sc-if value="{{r.ok}}" hint-placeholder-val="{{ true }}"><span class="cr">{{r.c4}}:1</span></sc-if>
        <sc-if value="{{r.fail}}" hint-placeholder-val="{{ false }}"><span class="cr bad">{{r.c4}}:1 未達 4.5</span></sc-if>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = [['赭紅','#a8362f','#faf2ec','#f3e3d8'],['抹茶綠','#5d7242','#f3f2e6','#e2e3c8'],['湖水綠','#2e6e72','#edf3f2','#d4e1de'],['櫻花粉','#a6586a','#faf0ee','#f1d8da'],['靛藍','#2c456c','#ecf0f6','#d4dde9'],['藤紫','#6a5897','#f0eef6','#ddd8e8'],['琥珀黃','#b8842a','#f7f0dd','#ecdcb6']];
    const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const lum = h => { const c = hx(h).map(v => { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
    const cr = (a, b) => { const A = lum(a), B = lum(b); return (Math.max(A, B) + 0.05) / (Math.min(A, B) + 0.05); };
    const rows = TH.map(t => {
      const deep = '#' + hx(t[1]).map((v, i) => Math.round(v * 0.65 + hx('#1e0d12')[i] * 0.35).toString(16).padStart(2, '0')).join('');
      const c4 = cr(t[1], t[3]);
      return { name: t[0], p: t[1], bg: t[2], pale: t[3], deep: deep,
        c1: cr('#ffffff', deep).toFixed(2), c2: cr(deep, '#ffffff').toFixed(2), c3: cr(deep, t[3]).toFixed(2),
        c4: c4.toFixed(2), ok: c4 >= 4.5, fail: c4 < 4.5 };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
