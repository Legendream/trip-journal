<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Paper background -->
  <rect width="512" height="512" fill="#f6f0e3"/>
  <!-- Subtle outer border -->
  <rect x="18" y="18" width="476" height="476" rx="8" fill="none" stroke="#d8cfb8" stroke-width="1.5" opacity="0.7"/>
  <!-- 品牌圖記「飛鳥與手帖」：與產生器頂部 .masthead-mark 同一圖形，置中於 (256,256) -->
  <g transform="translate(256 256) scale(7.3)" fill="none" stroke="#a8362f" stroke-linecap="round" stroke-linejoin="round">
    <!-- 飛鳥 -->
    <path d="M-15 -9 Q-7.5 -20 0 -12 Q7.5 -20 15 -9" stroke-width="4.2"/>
    <!-- 翻開的手帖 -->
    <path d="M-22 9 Q-11 3 0 9 Q11 3 22 9 V20 Q11 14 0 20 Q-11 14 -22 20 Z" stroke-width="3.6"/>
    <!-- 書脊 -->
    <path d="M0 9 V20" stroke-width="3.6"/>
  </g>
</svg>
