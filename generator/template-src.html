function _themeColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = (v, fb) => { const s = (cs.getPropertyValue(v) || "").trim(); return s || fb; };
  return {
    pink:     g("--pink", "#c94b72"),
    pink2:    g("--pink-2", "#e06a8a"),
    pinkBg:   g("--pink-bg", "#fff5f8"),
    pinkPale: g("--pink-pale", "#ffeef3"),
    text:     g("--text", "#1e0d12"),
    text2:    g("--text-2", "#5c3347"),
    text3:    g("--text-3", "#9a7080"),
    border:   g("--border", "#f0d4dc"),
  };
}

function _roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 依 grapheme cluster（而非 UTF-16 code unit）切字，避免把 emoji 或帶變體選擇符的字元切一半。
function _graphemes(text) {
  if (typeof Intl !== "undefined" && Intl.Segmenter) {
    try {
      const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
      return Array.from(seg.segment(String(text || "")), s => s.segment);
    } catch (e) {}
  }
  return Array.from(String(text || ""));
}

async function _copyLinkToClipboard(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn   = document.getElementById(btnId);
  try { await navigator.clipboard.writeText(input.value); }
  catch (e) {
    input.select();
    try { document.execCommand("copy"); } catch (e2) {}
  }
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = "✓ 已複製";
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }
}

function _daySnapshotKey(day) { return _PFX + "-share-snapshot-" + day; }
function _daySnapshot(d) {

function _dayHasShareUpdate(d) {

const LOCAL_EDIT_TOAST_KEY = _PFX + "-local-edit-toast-seen";
function _maybeShowLocalEditToast() {
  if (FB_ENABLED) return; // 進階模式（Firebase 同步）不適用
  let seen;
  try { seen = localStorage.getItem(LOCAL_EDIT_TOAST_KEY); } catch (e) { seen = null; }

// 只重繪 canvas，不動 #showcase-fields 的 DOM——一句話輸入框的 oninput 用這個，
// 才不會每打一個字就把 input 整個換掉、把游標位置跟焦點弄丟。
async function redrawShowcaseCanvas() {
  const countEl = document.getElementById("showcase-caption-count");
  if (countEl) countEl.textContent = _showcaseCaption.length + "/20";
  const canvas = document.getElementById("showcase-canvas");
  if (!canvas) return;
  const blobGen = ++_showcaseBlobGen;
  _showcaseBlob = null;
  const info = await drawShowcaseCanvas(canvas, _showcaseScope, _showcaseDay, _showcaseCaption, _showcasePhoto, _showcasePhotoFocus);
  if (info && blobGen === _showcaseBlobGen) {
    canvas.toBlob(b => { if (blobGen === _showcaseBlobGen) _showcaseBlob = b; }, "image/png");
  }
  // 照片框高度會隨景點數與一句話變動，裁切方向要畫完才知道
  if (info && info.photoAxis && info.photoAxis !== _showcasePhotoAxis) {
    _showcasePhotoAxis = info.photoAxis;
    _syncShowcasePhotoPos();
  }
}

function _loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload  = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function _drawQrOnCtx(ctx, url, x, y, size, dark, light) {
  if (typeof qrcode === "undefined") return false;
  try {
    const qr = qrcode(0, url.length > 1500 ? "L" : "M");
    qr.addData(url);
    qr.make();
    const modules = qr.getModuleCount();
    const margin  = 1;
    const cell    = size / (modules + margin * 2);
    if (light) { ctx.fillStyle = light; ctx.fillRect(x, y, size, size); }
    ctx.fillStyle = dark;
    for (let r = 0; r < modules; r++) {
      for (let c = 0; c < modules; c++) {
        if (qr.isDark(r, c)) ctx.fillRect(x + (c + margin) * cell, y + (r + margin) * cell, cell, cell);
      }
    }
    return true;
  } catch (e) { return false; }
}

// ─── 海報 v2 版面 ─────────────────────────────────────────────────
// 規格：docs/design-handoff/showcase-poster/spec.md（數值皆為畫布 px，720×1280）。
// 文字不直接壓在主題色上：背景用「主題色加深」保證白字對比 ≥ 9:1，主題原色只留在頂部色條。
const _SC_PAD = 48, _SC_CW = 624, _SC_LIMIT = 1016; // LIMIT = footer 頂 1056 − 40
const _SC_INK = "#100c0f";
const _SC_FONT = '-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Kaku Gothic ProN","Noto Sans CJK TC",sans-serif';

function _scRgb(h) {
  h = String(h || "").trim().replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) || 0);
}
function _scMix(a, b, t) {
  const x = _scRgb(a), y = _scRgb(b);
  return "#" + x.map((v, i) => Math.round(v * (1 - t) + y[i] * t).toString(16).padStart(2, "0")).join("");
}
function _scLum(h) {
  return _scRgb(h).map(v => v / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4))
    .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
}
function _scContrast(a, b) {
  const x = _scLum(a), y = _scLum(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}
// 由主題色 A、B 推導背景（加深到白字 ≥ 9:1）與強調色 acc（對較亮的背景 ≥ 5.5:1）
function _scPalette(A, B) {
  let k = 0.40;
  while (Math.min(_scContrast("#ffffff", _scMix(A, _SC_INK, k)), _scContrast("#ffffff", _scMix(B, _SC_INK, k))) < 9 && k < 0.95) k += 0.05;
  const bgTop = _scMix(A, _SC_INK, k), bgBot = _scMix(B, _SC_INK, k);
  const brighter = _scLum(bgTop) > _scLum(bgBot) ? bgTop : bgBot;
  let s = 0.30;
  while (_scContrast(_scMix(B, "#ffffff", s), brighter) < 5.5 && s < 0.95) s += 0.05;
  return { bgTop, bgBot, acc: _scMix(B, "#ffffff", s) };
}

// 逐字換行：中日文每個字都可斷，英數詞整個不拆（單詞本身超過一行才逐字拆），
// 行首不放收尾標點、行尾不留開頭標點。寬度一律用 ctx.measureText 量（呼叫前先設好 font）。
const _SC_CLOSE = /^[）」』】〉》、，。：；！？!?,.)\]…・]$/;
const _SC_OPEN  = /^[（「『【〈《(\[]$/;
function _scTokens(text) {
  const out = [];
  let word = "", open = "";
  const push = t => { out.push(open + t); open = ""; };
  _graphemes(text).forEach(g => {
    if (/^[A-Za-z0-9'’&%#@+\-_./:]$/.test(g)) { word += g; return; }
    if (word) { push(word); word = ""; }
    if (_SC_CLOSE.test(g) && out.length && !open) out[out.length - 1] += g;
    else if (_SC_OPEN.test(g)) open += g;
    else push(g);
  });
  if (word) push(word);
  if (open) out.push(open);
  return out;
}
function _scWrap(ctx, text, maxW) {
  const lines = [];
  let line = "";
  _scTokens(String(text || "")).forEach(tok => {
    if (!line && /^\s+$/.test(tok)) return; // 行首不留空白
    const test = line + tok;
    if (ctx.measureText(test).width <= maxW) { line = test; return; }
    if (line) lines.push(line.replace(/\s+$/, ""));
    line = "";
    if (/^\s+$/.test(tok)) return;
    if (ctx.measureText(tok).width <= maxW) { line = tok; return; }
    _graphemes(tok).forEach(g => { // 單一 token 比一行還寬：逐字拆
      if (line && ctx.measureText(line + g).width > maxW) { lines.push(line); line = g; }
      else line += g;
    });
  });
  if (line) lines.push(line.replace(/\s+$/, ""));
  return lines.length ? lines : [""];
}
// 最多 maxLines 行；放不下時最後一行尾端加「…」，逐字量到放得下為止
function _scClamp(ctx, text, maxW, maxLines) {
  const all = _scWrap(ctx, text, maxW);
  if (all.length <= maxLines) return all;
  const lines = all.slice(0, maxLines);
  const gs = _graphemes(lines[maxLines - 1]);
  while (gs.length && ctx.measureText(gs.join("") + "…").width > maxW) gs.pop();
  lines[maxLines - 1] = gs.join("").replace(/\s+$/, "") + "…";
  return lines;
}

// 照片 cover 填滿 w×h；focus 0 = 上／左、0.5 = 置中、1 = 下／右（只作用在被裁切的那一軸）
function _scDrawPhotoCover(ctx, img, w, h, focus) {
  const s = Math.max(w / img.width, h / img.height);
  const dw = img.width * s, dh = img.height * s;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
  ctx.drawImage(img, -(dw - w) * focus, -(dh - h) * focus, dw, dh);
  ctx.restore();
}

async function drawShowcaseCanvas(canvas, scope, day, caption, photoDataUrl, photoFocus = 0.5) {
  const gen = ++_showcaseDrawGen;
  let photoImg = null;
  if (scope === "day" && photoDataUrl) {
    photoImg = await _loadImage(photoDataUrl).catch(() => null);
  }
  if (gen !== _showcaseDrawGen) return; // 畫到一半又有更新的重繪請求，這次作廢

  const W = SHOWCASE_W, H = SHOWCASE_H, SCALE = 2;
  const PAD = _SC_PAD, CW = _SC_CW, LIMIT = _SC_LIMIT;
  canvas.width  = W * SCALE;
  canvas.height = H * SCALE;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.textBaseline = "middle"; // 文字框頂 + 行高 ÷ 2
  ctx.textAlign = "left";
  let photoAxis = null;

  const C = _themeColors();
  const pal = _scPalette(C.pink, C.pink2);
  const WHITE = "#ffffff", DIM = "rgba(255,255,255,0.78)";
  const tripTitle = (_CFG.meta && _CFG.meta.title) || "";

  const setFont = (px, weight) => { ctx.font = `${weight} ${px}px ${_SC_FONT}`; };
  const setSpacing = px => { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; };
  const put = (str, x, top, lh, color) => { ctx.fillStyle = color; ctx.fillText(str, x, top + lh / 2); };
  const clamp = (str, px, weight, maxW, maxLines) => { setFont(px, weight); return _scClamp(ctx, str, maxW, maxLines); };
  const countLines = (str, px, weight, maxW) => { setFont(px, weight); return _scWrap(ctx, str, maxW).length; };
  const hline = (x, y, w) => { ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(x, Math.round(y), w, 1); };

  // 背景：加深後的主題色，上 → 下漸層
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, pal.bgTop); bg.addColorStop(1, pal.bgBot);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  const drawBar = () => { // 頂部 10px 主題原色條（有照片版不畫）
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, C.pink); g.addColorStop(1, C.pink2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 10);
  };

  // 主題／旅程標題：最多 2 行；大字級要 3 行以上就改小一級，仍放不下第 2 行尾加「…」
  const layoutTitle = (str, big, small) => {
    const [f, lh] = countLines(str, big[0], 900, CW) <= 2 ? big : small;
    return { f, lh, lines: clamp(str, f, 900, CW, 2) };
  };
  const drawTitle = (t, top) => {
    setFont(t.f, 900);
    t.lines.forEach((ln, i) => put(ln, PAD, top + i * t.lh, t.lh, WHITE));
    return top + t.lines.length * t.lh;
  };

  // 同一列、基線對齊的一組文字（DAY 列），日期靠右
  const drawBaselineRow = (top, h, parts, date) => {
    const big = parts.reduce((a, b) => (b.px > a.px ? b : a));
    ctx.textBaseline = "alphabetic"; // 先切基線再量：字形上下緣是相對目前的 textBaseline
    setFont(big.px, big.weight);
    const m = ctx.measureText(big.str);
    const base = top + (h + m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
    let x = PAD;
    parts.forEach(p => {
      setFont(p.px, p.weight); setSpacing(p.spacing || 0);
      ctx.fillStyle = p.color;
      ctx.fillText(p.str, x, base);
      x += ctx.measureText(p.str).width + (p.gap || 0);
      setSpacing(0);
    });
    setFont(date.px, date.weight);
    ctx.fillStyle = WHITE; ctx.textAlign = "right";
    ctx.fillText(date.str, PAD + CW, base);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
  };

  // 底部群組（住宿、一句話）由 LIMIT 往上排；回傳上緣與繪製函式
  const layoutBottom = (hotelName, cap, o) => {
    let cur = LIMIT;
    const ops = [];
    if (cap) {
      const lines = clamp(`「${cap}」`, o.capF, 600, CW, 2);
      cur -= lines.length * o.capLH;
      const top = cur;
      ops.push(() => {
        setFont(o.capF, 600);
        lines.forEach((ln, i) => { // 「」用強調色
          const y = top + i * o.capLH;
          let x = PAD, body = ln;
          if (body.startsWith("「")) { put("「", x, y, o.capLH, pal.acc); x += ctx.measureText("「").width; body = body.slice(1); }
          const close = body.endsWith("」");
          if (close) body = body.slice(0, -1);
          put(body, x, y, o.capLH, WHITE);
          if (close) put("」", x + ctx.measureText(body).width, y, o.capLH, pal.acc);
        });
      });
    }
    if (hotelName) {
      if (cap) cur -= o.gap;
      cur -= o.hotelLH;
      const top = cur;
      const line = clamp("🏨 " + hotelName, o.hotelF, 600, CW, 1)[0];
      ops.push(() => { setFont(o.hotelF, 600); put(line, PAD, top, o.hotelLH, WHITE); });
    }
    return { top: cur, any: ops.length > 0, draw: () => ops.forEach(fn => fn()) };
  };

  // 景點清單：字級由大到小試，採用第一個「每項最多 2 行時全部放得下」的；
  // 最小字級仍放不下 → 由上往下放，留最後一行寫「＋N 個景點」
  const LIST_TEXT_X = PAD + 32, LIST_TEXT_W = CW - 32; // 圓點 12 ＋ 間距 20
  const fitList = (acts, top, limit, tiers) => {
    const avail = limit - top, n = acts.length;
    const hOf = (a, t) => Math.min(2, countLines(a, t.f, 600, LIST_TEXT_W)) * t.lh;
    const need = t => acts.reduce((s, a) => s + hOf(a, t), 0) + Math.max(0, n - 1) * t.g;
    let tier = tiers.find(t => need(t) <= avail);
    const fits = !!tier;
    let items = acts.map(text => ({ text, more: false }));
    if (!fits) {
      tier = tiers[tiers.length - 1];
      let used = 0, k = 0;
      while (k < n && used + hOf(acts[k], tier) + tier.g + tier.lh <= avail) { used += hOf(acts[k], tier) + tier.g; k++; }
      items = acts.slice(0, k).map(text => ({ text, more: false }))
        .concat([{ text: `＋${n - k} 個景點`, more: true }]);
    }
    return { fits, tier, items, top };
  };
  const drawList = list => {
    const t = list.tier;
    let y = list.top;
    list.items.forEach(it => {
      if (it.more) {
        setFont(t.f, 600);
        put(it.text, LIST_TEXT_X, y, t.lh, pal.acc);
        y += t.lh + t.g;
        return;
      }
      const lines = clamp(it.text, t.f, 600, LIST_TEXT_W, 2);
      ctx.fillStyle = pal.acc;
      ctx.beginPath(); ctx.arc(PAD + 6, y + t.lh / 2, 6, 0, Math.PI * 2); ctx.fill();
      lines.forEach((ln, i) => put(ln, LIST_TEXT_X, y + i * t.lh, t.lh, WHITE));
      y += lines.length * t.lh + t.g;
    });
  };

  if (scope === "day") {
    const d = DAYS.find(x => x.day === day);
    if (!d) { ctx.setTransform(1, 0, 0, 1, 0, 0); return; }
    const acts  = _dayMergedActs(d).map(a => a.name).filter(Boolean);
    const hotel = _dayHotelInfo(d);
    const hotelName = hotel && hotel.name;
    const cap = (caption || "").trim();
    const dateText = `${d.date}（${d.wd}）`;
    const totalText = `／ ${DAYS.length} 天`;

    if (!photoImg) {
      drawBar();
      setFont(26, 600);
      put(clamp(tripTitle, 26, 600, CW, 1)[0], PAD, 64, 36, DIM);
      drawBaselineRow(124, 128, [
        { str: "DAY", px: 30, weight: 800, color: pal.acc, spacing: 2, gap: 14 },
        { str: String(d.day), px: 128, weight: 900, color: WHITE, spacing: -4, gap: 16 },
        { str: totalText, px: 30, weight: 600, color: DIM },
      ], { str: dateText, px: 40, weight: 800 });
      const title = layoutTitle(d.theme || "", [64, 77], [52, 62]);
      const themeBottom = drawTitle(title, 272);
      const bottom = layoutBottom(hotelName, cap, { hotelF: 30, hotelLH: 44, capF: 32, capLH: 46, gap: 20 });
      const list = fitList(acts, themeBottom + 44, bottom.any ? bottom.top - 40 : LIMIT, [
        { f: 48, lh: 64, g: 24 }, { f: 40, lh: 54, g: 14 }, { f: 34, lh: 48, g: 10 },
        { f: 30, lh: 42, g: 8 },  { f: 28, lh: 38, g: 6 },
      ]);
      drawList(list);
      bottom.draw();
    } else {
      // 照片高度 P 依景點數決定；清單放不下時每次縮 80，不低於 320，仍放不下才截斷清單
      const n = acts.length;
      const title = layoutTitle(d.theme || "", [56, 67], [48, 58]);
      const bottom = layoutBottom(hotelName, cap, { hotelF: 28, hotelLH: 40, capF: 30, capLH: 42, gap: 12 });
      let P = n <= 4 ? 520 : n <= 6 ? 440 : 400, list;
      for (;;) {
        list = fitList(acts, P + 80 + title.lines.length * title.lh + 32, bottom.any ? bottom.top - 32 : LIMIT, [
          { f: 36, lh: 50, g: 12 }, { f: 32, lh: 44, g: 8 }, { f: 28, lh: 40, g: 6 },
        ]);
        if (list.fits || P - 80 < 320) break;
        P -= 80;
      }
      _scDrawPhotoCover(ctx, photoImg, W, P, photoFocus);
      // 照片比框更寬 → 左右裁切；否則上下裁切（決定位置按鈕顯示上中下或左中右）
      photoAxis = photoImg.width / photoImg.height > W / P ? "x" : "y";
      // 照片底部 160px 漸層融進該 y 位置的背景色
      const fadeTo = _scMix(pal.bgTop, pal.bgBot, P / H);
      const fade = ctx.createLinearGradient(0, P - 160, 0, P);
      fade.addColorStop(0, fadeTo + "00"); fade.addColorStop(1, fadeTo);
      ctx.fillStyle = fade;
      ctx.fillRect(0, P - 160, W, 160);
      // 行程名稱膠囊（照片左上）
      const pill = clamp(tripTitle, 24, 700, CW - 40, 1)[0];
      setFont(24, 700);
      ctx.fillStyle = pal.bgTop;
      _roundRect(ctx, PAD, 48, ctx.measureText(pill).width + 40, 44, 22); ctx.fill();
      put(pill, PAD + 20, 48, 44, WHITE);
      drawBaselineRow(P + 28, 40, [
        { str: `DAY ${d.day}`, px: 32, weight: 900, color: pal.acc, gap: 12 },
        { str: totalText, px: 26, weight: 600, color: DIM },
      ], { str: dateText, px: 32, weight: 800 });
      drawTitle(title, P + 80);
      drawList(list);
      bottom.draw();
    }
  } else {
    const days = _showcaseDaysWithContent();
    const n = days.length;
    const first = DAYS[0], last = DAYS[DAYS.length - 1];
    drawBar();
    const title = layoutTitle(tripTitle, [56, 67], [48, 58]);
    const subY = drawTitle(title, 64) + 12;
    const sub = first && last ? `${first.date}（${first.wd}）→ ${last.date}（${last.wd}）・${DAYS.length} 天` : `${DAYS.length} 天`;
    setFont(26, 600);
    put(clamp(sub, 26, 600, CW, 1)[0], PAD, subY, 36, DIM);
    const top = subY + 76, avail = LIMIT - top;

    // 一列：D 編號與 emoji 對齊名稱第一行
    const drawRow = (x, y, rowH, g, label, labelColor, emoji, nameLines, nameColor, dateStr, border) => {
      const blockH = nameLines.length * g.lh + (dateStr ? 28 : 0);
      const cTop = y + (rowH - blockH) / 2;
      setFont(g.dF, 800); put(label, x, cTop, g.lh, labelColor);
      if (emoji) { setFont(g.eF, 400); put(emoji, x + g.dW, cTop, g.lh, WHITE); }
      setFont(g.f, 700);
      nameLines.forEach((ln, i) => put(ln, x + g.dW + g.eW, cTop + i * g.lh, g.lh, nameColor));
      if (dateStr) { setFont(22, 500); put(dateStr, x + g.dW + g.eW, cTop + nameLines.length * g.lh, 28, DIM); }
      if (border) hline(x, y + rowH, g.w);
    };

    if (n <= 14) {
      // 單欄：名稱最多 2 行，列高依內容而定；每列留白至少 16，不夠就換下一級字級
      const tiers = n <= 9
        ? [{ f: 36, lh: 44, date: true }, { f: 32, lh: 40, date: true }, { f: 30, lh: 38, date: false }, { f: 28, lh: 36, date: false }]
        : [{ f: 34, lh: 44, date: false }, { f: 30, lh: 40, date: false }, { f: 28, lh: 36, date: false }];
      const geo = t => n <= 9
        ? { ...t, w: CW, dW: 76, eW: 60, dF: 28, eF: 40 }
        : { ...t, w: CW, dW: Math.round(t.f * 2.4), eW: Math.round(t.f * 1.7), dF: Math.round(t.f * 0.8), eF: Math.round(t.f * 1.1) };
      const heights = (t, maxL) => { const g = geo(t); return days.map(d => Math.min(maxL, countLines(d.theme || "", t.f, 700, CW - g.dW - g.eW)) * t.lh + (t.date ? 28 : 0)); };
      const sum = a => a.reduce((s, v) => s + v, 0);
      let maxL = 2, tier = tiers.find(t => sum(heights(t, 2)) + n * 16 <= avail);
      if (!tier) { tier = tiers[tiers.length - 1]; maxL = 1; }
      const g = geo(tier), hs = heights(tier, maxL);
      const pad = Math.min((avail - sum(hs)) / n, n <= 9 ? 32 : 36);
      let y = top;
      days.forEach((d, i) => {
        const rowH = hs[i] + pad;
        const lines = clamp(d.theme || "", g.f, 700, CW - g.dW - g.eW, maxL);
        drawRow(PAD, y, rowH, g, `D${d.day}`, pal.acc, d.emoji || "", lines, WHITE, g.date ? `${d.date}（${d.wd}）` : "", i < n - 1);
        y += rowH;
      });
    } else {
      // 15 天以上：兩欄（欄寬 296、欄距 32），先排滿左欄；超過 30 天第 30 格寫「還有 N 天」
      const over = n > 30;
      const cells = over ? days.slice(0, 29) : days;
      const m = over ? 30 : n, per = Math.ceil(m / 2), rh = avail / per;
      const two = rh >= 70;
      const f = two ? 26 : Math.max(22, Math.min(28, Math.floor(rh * 0.5)));
      const g = { f, lh: two ? 32 : Math.round(f * 1.3), w: 296, dW: Math.round(f * 2.3), dF: Math.round(f * 0.85), eW: Math.round(f * 1.5), eF: Math.round(f * 1.05) };
      const nameW = 296 - g.dW - g.eW;
      const cellAt = i => ({ x: PAD + Math.floor(i / per) * (296 + 32), y: top + (i % per) * rh, border: (i % per) < per - 1 && i < m - 1 });
      cells.forEach((d, i) => {
        const c = cellAt(i);
        drawRow(c.x, c.y, rh, g, `D${d.day}`, pal.acc, d.emoji || "", clamp(d.theme || "", f, 700, nameW, two ? 2 : 1), WHITE, "", c.border);
      });
      if (over) {
        const c = cellAt(29);
        drawRow(c.x, c.y, rh, g, "…", pal.acc, "", clamp(`還有 ${n - 29} 天`, f, 700, nameW, 1), pal.acc, "", false);
      }
    }
  }

  // ── 回訪入口 footer：QR ＋ 標語 ＋ 網址，皆為靜態圖片內容，不可點擊 ──
  // 只在整趟海報顯示：這是給非同行者看的「來做一份自己的」入口。
  // 單日海報是傳給同行旅伴看今天的行程，不需要邀請對方去用生成器。
  if (scope === "trip") {
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    _roundRect(ctx, PAD, 1056, CW, 176, 24); ctx.fill();
    let textX = PAD + 24;
    if (typeof qrcode !== "undefined") {
      ctx.fillStyle = "#ffffff";
      _roundRect(ctx, 64, 1072, 144, 144, 12); ctx.fill();
      if (_drawQrOnCtx(ctx, SHOWCASE_HOMEPAGE_URL, 70, 1078, 132, "#1e0d12", null)) textX = 232;
    }
    setFont(30, 800);
    put("也來排一趟自己的行程", textX, 1100, 40, WHITE);
    setFont(24, 500);
    put(SHOWCASE_HOMEPAGE_URL.replace(/^https?:\/\//, "").replace(/\/$/, ""), textX, 1148, 32, DIM);
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  return { photoAxis };
}

function copyShowcaseLink() { return _copyLinkToClipboard("showcase-link-input", "showcase-copy-btn"); }

// 瀏覽器能不能把「圖片檔」交給系統分享選單（Firefox 有分享功能但不支援檔案）
function _canShareImageFile() {
  if (!navigator.share || !navigator.canShare) return false;
  try { return navigator.canShare({ files: [new File([new Blob()], "poster.png", { type: "image/png" })] }); }
  catch (e) { return false; }
}

function _downloadShowcaseBlob(blob, fileName) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function sendShowcaseShare() {
  const canvas = document.getElementById("showcase-canvas");
  if (!canvas) return;
  const isDay = _showcaseScope === "day";
  const d = isDay ? DAYS.find(x => x.day === _showcaseDay) : null;
  const label = isDay ? `day${_showcaseDay}` : "trip";
  const fileName = `poster-${label}-${Date.now()}.png`;
  const title = (_CFG.meta && _CFG.meta.title) || "我的行程";
  // 單日是傳給同行旅伴看今天的行程，分享文字不附生成器首頁連結；
  // 整趟是給非同行者看的展示海報，才附回訪入口。
  const shareText = isDay
    ? `Day ${d ? d.day : _showcaseDay}・${(d && d.theme) || title}`
    : `${title}\n${SHOWCASE_HOMEPAGE_URL}`;
  const afterDelivered = () => { if (isDay) { _markDayShared(_showcaseDay); renderItinerary({ cardsOnly: true }); } };

  const deliver = blob => {
    if (!blob) { alert("海報產生失敗，請稍後再試"); return; }
    const file = new File([blob], fileName, { type: "image/png" });
    if (!(_canShareImageFile() && navigator.canShare({ files: [file] }))) { _downloadShowcaseBlob(blob, fileName); afterDelivered(); return; }
    navigator.share({ files: [file], text: shareText, title }).then(afterDelivered).catch(e => {
      if (e && e.name === "AbortError") return; // 使用者自己取消分享
      alert("沒辦法分享，改幫你下載圖片");
      _downloadShowcaseBlob(blob, fileName);
      afterDelivered();
    });
  };
  // 備好的 PNG 直接同步交出去；還沒轉好（剛改完就按）才當場轉檔
  if (_showcaseBlob) deliver(_showcaseBlob);
  else canvas.toBlob(deliver, "image/png");
}

// ─── Itinerary collab (旅伴協作行程) ──────────────────────────────
function _esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function hideItinAct(pid) {
  if (!firebaseReady) return;
  itinMenuKey = null;
  const info = _presetActInfo(pid);
  _dbRef(ITIN_PATH + "/hidden/" + pid).set(true);
  _trashDelete("已刪除景點", { kind: "act-preset", pid: pid, day: info.day, label: info.name });
  _maybeShowLocalEditToast();
}

function deleteItinAct(key) {
  if (!firebaseReady) return;
  itinMenuKey = null;
  const item = itinAdded.find(x => x._key === key);
  const data = item ? Object.assign({}, item) : null;
  if (data) delete data._key;
  _dbRef(ITIN_PATH + "/added/" + key).remove();
  _trashDelete("已刪除景點", { kind: "act-added", day: data ? data.day : 0, label: data ? data.name : "景點", data: data || null });
  _maybeShowLocalEditToast();
}

// 圖示選單：這趟行程已用過的圖示排前面（新增的景點跟既有行程視覺一致），再補通用預設
const ITIN_ICONS = (() => {
  const list = [];
  (DAYS || []).forEach(d => (d.acts || []).forEach(a => {
    if (a && a.icon && !list.includes(a.icon)) list.push(a.icon);
  }));
  ["📍","🍜","☕","🏯","⛩️","🏞️","🌸","🛍️","🎡","♨️","🚆","🚗","✈️","🏨","📷"].forEach(ic => {

// ─── 最近刪除：寫入 trash + 還原 + 渲染 ───────────────────────────
function _trashDelete(msg, entry) {
  entry.deletedAt = Date.now();
  const tk = _dbRef(ITIN_PATH + "/trash").push(entry).key;
  showUndoToast(msg, () => { _doRestore(entry); _dbRef(ITIN_PATH + "/trash/" + tk).remove(); });
}
function _doRestore(t) {
  
  if (t.kind === "act-added") { if (t.data) _dbRef(ITIN_PATH + "/added").push(t.data); }
  else if (t.kind === "act-preset") { _dbRef(ITIN_PATH + "/hidden/" + t.pid).remove(); }
  else if (t.kind === "hotel")  { if (t.hadPreset) _dbRef(ITIN_PATH + "/hotelHidden/" + t.day).remove();  else if (t.data) _dbRef(ITIN_PATH + "/hotelEdited/" + t.day).set(t.data); }
}
function restoreFromTrash(key) {
  if (!firebaseReady) return;
  const t = itinTrash.find(x => x._key === key);
  if (!t) return;
  _doRestore(t);
  _dbRef(ITIN_PATH + "/trash/" + key).remove();
  hideUndoToast();
}
// Resolve a preset act by its stable pid (act.id when present, else legacy "day_index").
function _presetByPid(pid) {
  for (const d of DAYS) {
    for (let i = 0; i < d.acts.length; i++) {
      if ((d.acts[i].id || (d.day + "_" + i)) === pid) return { day: d.day, idx: i, act: d.acts[i] };
    }
  }
  return null;
}
function _presetActInfo(pid) {
  const r = _presetByPid(pid);
  const ov = itinEdited[pid] || {};
  return { day: r ? r.day : 0, name: ov.name || (r && r.act.name) || "景點" };
}
function _trashWhen(ts) {
  if (!ts) return "";
  const diff = Date.now() - ts;
  const dd = Math.floor(diff / 86400000); if (dd > 0) return dd + " 天前";
  const hh = Math.floor(diff / 3600000);  if (hh > 0) return hh + " 小時前";
  const mm = Math.floor(diff / 60000);    if (mm > 0) return mm + " 分鐘前";
  return "剛剛";
}
function renderTrash() {
  const wrap = document.getElementById("itin-trash-wrap");
  if (!wrap) return;
  const canEdit = FB_ENABLED && firebaseReady;
  if (!canEdit || !itinTrash.length) { wrap.innerHTML = ""; return; }
  const rows = itinTrash.map(t => {
    const icon = t.kind === "hotel" ? "🏨" : "📍";
    return `
      <div class="trash-item">
        <span class="trash-icon">${icon}</span>
        <div class="trash-info">
          <div class="trash-name">${_esc(t.label || "項目")}</div>
          <div class="trash-meta">Day ${t.day || "?"}・${_trashWhen(t.deletedAt)}刪除</div>
        </div>
        <button class="trash-restore-btn" onclick="restoreFromTrash('${t._key}')">↩︎ 復原</button>
      </div>`;
  }).join("");
  wrap.innerHTML = `
    <div class="trash-section">
      <button class="trash-header" onclick="trashOpen=!trashOpen;renderTrash()">
        <span class="trash-title">🗑 最近刪除 <span class="trash-count">${itinTrash.length}</span></span>
        <span class="trash-caret">${trashOpen ? "▲" : "▼"}</span>
      </button>
      ${trashOpen ? `<div class="trash-list">${rows}</div><div class="trash-foot">刪除的項目保留 30 天，隨時可以復原</div>` : ""}
    </div>`;
}

// 取回某個景點目前的值（預設項套上 edited 覆寫；新增項取 added 資料）
function _findItinItem(id) {

    return { kind: "added", key: raw, day: a.day, icon: a.icon || "📍",
             name: a.name || "", time: a.time || "", sub: a.sub || "",
             map: (a.map && a.map !== a.name) ? a.map : "", geo: a.geo || "" };
  }
  const r = _presetByPid(raw);
  if (!r) return null;
  const m = Object.assign({}, r.act, itinEdited[raw] || {});
  return { kind: "preset", pid: raw, day: r.day, icon: m.icon || "📍",
           name: m.name || "", time: m.time || "", sub: m.sub || "",
           map: (m.map && m.map !== m.name) ? m.map : "", geo: m.geo || "" };

function _mapStatusHtml(value, noun) {
  const info = _mapLinkInfo(value);
  switch (info.status) {
    case "ok": return `✅ 已定位：${_esc(info.name || "地圖上指定的位置")}<br>
      <a class="geo-verify-link" href="${_esc(info.url)}" target="_blank" rel="noopener">🗺 在 Google 地圖確認</a>`;
    case "pending": return "⏳ 讀取中…";
    case "failed":  return "⚠️ 讀不到位置，請確認連結或網路後重新貼上（仍可儲存）";
    case "noplace": return "⚠️ 這個連結沒有指向單一地點，請在 Google 地圖點選一個地點後再分享";
    case "text":    return `目前只有文字：「📍 地圖」會用這段文字搜尋，但不會查天氣。貼 Google 地圖分享連結，這個${noun}才會有自己的天氣。`;
    default:        return `在 Google 地圖找到地點 → 分享 → 複製連結，貼到上面。貼了這個${noun}才會有自己的天氣；沒貼就沿用當天其他地點的天氣。`;
  }
}
function _mapStatusClass(value) {
  const st = _mapLinkInfo(value).status;
  return st === "ok" ? "map-status ok" : (st === "failed" || st === "noplace") ? "map-status warn" : "map-status";
}
function _mapFieldHtml(inputId, value, nameInputId, noun) {
  return `
    <div class="form-row">
      <div class="form-label">Google 地圖分享連結（選填）</div>
      <input class="form-input" type="text" id="${inputId}" value="${_esc(value)}" autocomplete="off"
             placeholder="貼上 Google 地圖的分享連結" oninput="onMapFieldInput('${inputId}','${noun}')">
      <button type="button" class="btn map-find-btn" onclick="openMapSearch('${nameInputId}','${noun}')">🔍 到 Google 地圖找</button>
      <div class="${_mapStatusClass(value)}" id="${inputId}-status">${_mapStatusHtml(value, noun)}</div>
    </div>`;
}
function _paintMapStatus(inputId, noun) {
  const inp = document.getElementById(inputId);
  const box = document.getElementById(inputId + "-status");
  if (!inp || !box) return;
  box.className = _mapStatusClass(inp.value);
  box.innerHTML = _mapStatusHtml(inp.value, noun);
}
const _mapFieldTimers = {};
// 貼上（或打字）後：短網址自動送去展開，讀完再更新狀態；使用者已改成別的內容就不覆蓋
function onMapFieldInput(inputId, noun, immediate) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  const val = inp.value.trim();
  if (_isShortMapLink(val) && !_LINK_CACHE[val] && !immediate) _LINK_TRIED.delete(val);   // 使用者重新貼上 → 允許重試
  _paintMapStatus(inputId, noun);
  clearTimeout(_mapFieldTimers[inputId]);
  if (!_isShortMapLink(val) || _LINK_CACHE[val] || _LINK_TRIED.has(val)) return;
  _mapFieldTimers[inputId] = setTimeout(() => {
    _expandMapLink(val).then(() => {
      const now = document.getElementById(inputId);
      if (now && now.value.trim() === val) _paintMapStatus(inputId, noun);
    });
  }, immediate ? 0 : 300);
}
// 「🔍 到 Google 地圖找」：用已填的名稱開 Google 地圖搜尋（手機會開 Google 地圖 App）
function openMapSearch(nameInputId, noun) {

    });
  } else if (itinEditTarget && itinEditTarget.kind === "preset") {

      name,
      sub:  v.sub.trim(),
      time: v.time,
      map:  _resolveMapStr(v.map) || name,

  let html = "";

  // ── 行前清單 ──────────────────────────────────────
  // 固定（預設）項目與自訂項目合成同一份清單、用同一套外觀渲染，兩者都可勾選／編輯／刪除
  // （刪除固定項目＝隱藏，不動 CHECKLIST 本身，因為那是產生時就烤進設定檔的預設值）。
  const fixedItems = CHECKLIST
    .map((item, i) => ({ i, item }))
    .filter(({ i }) => !checklistHidden[i])
    .map(({ i, item }) => ({
      kind: "fixed", id: i,
      text: checklistEdited[i] != null ? checklistEdited[i] : item,
      done: checked.has(i),
    }));
  const customItems = customChecks.map(c => ({ kind: "custom", id: c.id, text: c.text, done: c.done }));
  const allChecks = fixedItems.concat(customItems);

  const totalDone = allChecks.filter(c => c.done).length;
  const totalAll  = allChecks.length;

  html += `<div class="sec-title">✅ 行前清單 <span style="font-weight:400;color:var(--text-3);font-size:12px;margin-left:6px">${totalDone}/${totalAll}</span></div>`;

  allChecks.forEach(c => {
    const editKey = c.kind + ":" + c.id;
    if (editKey === editingCheckId) {
      html += `
        <div class="list-item" style="gap:6px">
          <input class="list-edit-input" id="check-edit-${editKey}" value="${_escHtml(c.text)}"
                 onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)saveEditCheckItem('${c.kind}',${c.id});if(event.key==='Escape'&&!event.isComposing&&event.keyCode!==229)cancelEditCheckItem()">
          <button class="list-save-btn" onclick="saveEditCheckItem('${c.kind}',${c.id})">✓</button>
          <button class="del-btn"       onclick="cancelEditCheckItem()">✕</button>
        </div>`;
    } else {
      html += `
        <div class="list-item ${c.done ? "done" : ""}" onclick="toggleCheckItem('${c.kind}',${c.id})">
          <div class="list-check"><span class="list-check-mark">✓</span></div>
          <span class="list-label">${_escHtml(c.text)}</span>
          <button class="edit-btn" onclick="event.stopPropagation();startEditCheckItem('${c.kind}',${c.id})">✏️</button>
          <button class="del-btn"  onclick="event.stopPropagation();deleteCheckItem('${c.kind}',${c.id})">✕</button>
        </div>`;
    }
  });

  if (showCheckInput) {
    html += `
      <div class="add-row">
        <input id="check-input" type="text" placeholder="新增項目..."
               onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)addCustomCheck(this.value)">
        <button class="add-row-btn" onclick="addCustomCheck(document.getElementById('check-input').value)">新增</button>
        <button class="del-btn" onclick="showCheckInput=false;renderPacking()">✕</button>
      </div>`;
    setTimeout(() => document.getElementById("check-input")?.focus(), 50);
  } else {
    html += `<button class="add-trigger" onclick="showCheckInput=true;renderPacking()">＋ 新增清單項目</button>`;
  }

  document.getElementById("tab-checklist-content").innerHTML = html;
}

// ─── Render: Notes (注意事項) ─────────────────────────────────────
function renderNotes() {
  let html = "";

  // 合併預設 + 使用者新增，過濾已隱藏的預設
  const presets = (NOTES || []).map((n, idx) => {
    if (!n || n.text == null || !String(n.text).trim()) return null;
    if (notesHidden[idx]) return null;
    const ov = notesEdited[idx];
    return { kind: "preset", idx, icon: (ov && ov.icon) || n.icon || "⚠️", text: (ov && ov.text) || n.text };
  }).filter(Boolean);

  const allItems = [
    ...presets.map(p => ({ ...p })),
    ...notesAdded.map(a => ({ kind: "added", key: a._key, icon: a.icon || "⚠️", text: a.text }))
  ];

  if (allItems.length === 0 && !firebaseReady) {
    html = `<div style="color:var(--text-3);font-size:13px;text-align:center;padding:24px 0">尚無注意事項</div>`;
  } else {
    allItems.forEach(item => {
      const mk = item.kind === "preset" ? `p:${item.idx}` : `a:${item.key}`;
      const menuOpen = noteMenuKey === mk;
      const isNearBottom = false; // TODO: detect near-bottom if needed
      html += `<div class="note-item">
        <span class="note-icon">${item.icon}</span>
        <span class="note-item-body">${_escHtml(item.text)}</span>
        ${firebaseReady ? `<div style="position:relative;flex-shrink:0">
          <button class="act-menu-btn" aria-label="更多操作" onclick="event.stopPropagation();toggleNoteMenu('${mk}')">⋯</button>
          ${menuOpen ? `<div class="act-menu">
            <button class="act-menu-item" onclick="startEditNote('${mk}')">✏️ 編輯</button>
            <button class="act-menu-item danger" onclick="deleteNote('${mk}')">🗑 刪除</button>
          </div>` : ""}
        </div>` : ""}
      </div>`;
    });
    if (firebaseReady) {
      html += `<button class="note-add-btn" onclick="startAddNote()">＋ 新增注意事項</button>`;
    }
  }

  const el = document.getElementById("tab-checklist-content");
  if (el) el.innerHTML = html;
}

function _escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function toggleNoteMenu(mk) {
  noteMenuKey = (noteMenuKey === mk) ? null : mk;
  renderNotes();
}

function startAddNote() {
  noteMenuKey = null;
  noteEditTarget = null;
  noteFormSeed = { icon: "⚠️", text: "" };
  renderNoteFormBody();
  document.getElementById("note-overlay-title").textContent = "＋ 新增注意事項";
  document.getElementById("note-overlay").style.display = "flex";
}

function startEditNote(mk) {
  noteMenuKey = null;
  if (mk.startsWith("p:")) {
    const idx = parseInt(mk.slice(2), 10);
    const ov = notesEdited[idx];
    const base = (NOTES || [])[idx] || {};
    noteEditTarget = { kind: "preset", idx };
    noteFormSeed = { icon: (ov && ov.icon) || base.icon || "⚠️", text: (ov && ov.text) || base.text || "" };
  } else {
    const key = mk.slice(2);
    const item = notesAdded.find(a => a._key === key) || {};
    noteEditTarget = { kind: "added", key };
    noteFormSeed = { icon: item.icon || "⚠️", text: item.text || "" };
  }
  renderNoteFormBody();
  document.getElementById("note-overlay-title").textContent = "✏️ 編輯注意事項";
  document.getElementById("note-overlay").style.display = "flex";
}

function hideNoteOverlay() {
  document.getElementById("note-overlay").style.display = "none";
  noteEditTarget = null;
  noteFormSeed = { icon: "⚠️", text: "" };
}

function renderNoteFormBody() {
  const ICONS = ["⚠️","💡","🔌","🛂","🚗","💊","📱","💰","🌡️","📋","🔑","🧴"];
  const iconPills = ICONS.map(ic =>
    `<button class="member-pill${noteFormSeed.icon === ic ? " selected" : ""}" onclick="noteFormSeed.icon='${ic}';renderNoteFormBody()">${ic}</button>`
  ).join("");
  document.getElementById("note-form-body").innerHTML = `
    <div style="margin-bottom:10px">
      <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">圖示</div>
      <div class="member-picker">${iconPills}</div>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">內容</div>
      <textarea id="note-form-text" rows="3" placeholder="輸入注意事項…"
        style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical"
        oninput="noteFormSeed.text=this.value">${_escHtml(noteFormSeed.text)}</textarea>
    </div>
    <button class="primary-btn" style="width:100%" onclick="saveNoteEdit()">儲存</button>
  `;
  // 游標移到文字尾端
  const ta = document.getElementById("note-form-text");
  if (ta) { const len = ta.value.length; ta.focus(); ta.setSelectionRange(len, len); }
}

function saveNoteEdit() {
  const text = (noteFormSeed.text || "").trim();
  if (!text) return;
  const icon = noteFormSeed.icon || "⚠️";

  if (!noteEditTarget) {
    // 新增
    _dbRef(NOTES_PATH + "/added").push({ icon, text, timestamp: Date.now() });
  } else if (noteEditTarget.kind === "preset") {
    _dbRef(NOTES_PATH + "/edited/" + noteEditTarget.idx).set({ icon, text });
  } else {
    _dbRef(NOTES_PATH + "/added/" + noteEditTarget.key).update({ icon, text });
  }
  hideNoteOverlay();
}

function deleteNote(mk) {
  noteMenuKey = null;
  if (mk.startsWith("p:")) {
    const idx = parseInt(mk.slice(2), 10);
    _dbRef(NOTES_PATH + "/hidden/" + idx).set(true);
    _dbRef(NOTES_PATH + "/edited/" + idx).remove();
  } else {
    const key = mk.slice(2);
    _dbRef(NOTES_PATH + "/added/" + key).remove();
  }
  // local mode: _dbRef().set/remove fires listener → renderNotes(); FB mode: listener fires on write
}

// ─── Custom Checklist ─────────────────────────────────────────────

function addCustomCheck(text) {
  if (!text.trim()) return;
  customChecks.push({ id: Date.now(), text: text.trim(), done: false });
  localStorage.setItem(CUSTOM_CHECK_KEY, JSON.stringify(customChecks));
  showCheckInput = false;
  renderPacking();
}
function toggleCheckItem(kind, id) {
  if (kind === "fixed") {
    checked.has(id) ? checked.delete(id) : checked.add(id);
    localStorage.setItem(CHECK_KEY, JSON.stringify([...checked]));
  } else {
    const item = customChecks.find(i => i.id === id);
    if (item) item.done = !item.done;
    localStorage.setItem(CUSTOM_CHECK_KEY, JSON.stringify(customChecks));
  }
  renderPacking();
}
function deleteCheckItem(kind, id) {
  if (kind === "fixed") {
    checklistHidden[id] = true;
    localStorage.setItem(CHECK_HIDDEN_KEY, JSON.stringify(checklistHidden));
    checked.delete(id);
    localStorage.setItem(CHECK_KEY, JSON.stringify([...checked]));
  } else {
    customChecks = customChecks.filter(i => i.id !== id);
    localStorage.setItem(CUSTOM_CHECK_KEY, JSON.stringify(customChecks));
  }
  renderPacking();
}
function startEditCheckItem(kind, id) {
  editingCheckId = kind + ":" + id;
  renderPacking();
  setTimeout(() => document.getElementById("check-edit-" + kind + ":" + id)?.focus(), 50);
}
function saveEditCheckItem(kind, id) {
  const val = (document.getElementById("check-edit-" + kind + ":" + id)?.value || "").trim();
  if (!val) return;
  if (kind === "fixed") {
    checklistEdited[id] = val;
    localStorage.setItem(CHECK_EDITED_KEY, JSON.stringify(checklistEdited));
  } else {
    const item = customChecks.find(i => i.id === id);
    if (item) item.text = val;
    localStorage.setItem(CUSTOM_CHECK_KEY, JSON.stringify(customChecks));
  }
  editingCheckId = null;
  renderPacking();
}
function cancelEditCheckItem() {
  editingCheckId = null;
  renderPacking();
}

// ─── Shopping List ────────────────────────────────────────────────

function _shopSave() { localStorage.setItem(SHOPPING_KEY, JSON.stringify(shoppingItems)); }

function addShopping(text, location = "") {
  if (!text.trim()) { showShoppingInput = false; pendingShoppingPhotos = []; renderShopping(); return; }
  const item = { id: Date.now(), text: text.trim(), bought: false,
                 location: (location || "").trim(), photos: pendingShoppingPhotos.slice() };
  shoppingItems.push(item); _shopSave();
  showShoppingInput = false; pendingShoppingPhotos = [];
  renderShopping();
}
function toggleShopping(id) {
  const item = shoppingItems.find(i => i.id === id);
  if (!item) return;
  item.bought = !item.bought; _shopSave(); renderShopping();
}
function deleteShopping(id) {
  shoppingItems = shoppingItems.filter(i => i.id !== id); _shopSave(); renderShopping();
}
function startEditShopping(id) {
  editingShoppingId = id;
  renderShopping();
  setTimeout(() => document.getElementById("shop-edit-" + id)?.focus(), 50);
}
function saveEditShopping(id) {
  const val = (document.getElementById("shop-edit-" + id)?.value || "").trim();
  if (!val) return;
  const item = shoppingItems.find(i => i.id === id);
  if (!item) return;
  item.text = val;
  item.location = (document.getElementById("shop-loc-edit-" + id)?.value || "").trim();
  editingShoppingId = null;
  _shopSave(); renderShopping();
}
function cancelEditShopping() {
  editingShoppingId = null;
  renderShopping();
}

// ─── Shopping: Pending Photo (new-item form) ─────────────────────

function openPendingPhotoPicker() {
  const slots = 3 - pendingShoppingPhotos.length;
  if (slots <= 0) return;
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.multiple = true;
  input.onchange = async e => {
    const files = Array.from(e.target.files).slice(0, slots);
    for (const file of files) {
      const data = await compressImage(file);
      pendingShoppingPhotos.push({ data });
    }
    renderShopping();
  };
  input.click();
}
function deletePendingPhoto(idx) {
  pendingShoppingPhotos.splice(idx, 1);
  renderShopping();
}

// ─── Shopping: Photo Utilities ────────────────────────────────────

async function compressImage(file, maxKB = 120) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else       { w = Math.round(w * MAX / h); h = MAX; }
        }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        let q = 0.82, data = c.toDataURL("image/jpeg", q);
        while (data.length > maxKB * 1024 * 1.37 && q > 0.3) {
          q = Math.max(q - 0.1, 0.3);
          data = c.toDataURL("image/jpeg", q);
        }
        resolve(data);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function openPhotoPicker(itemId) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.multiple = true;
  input.onchange = async e => {
    const item = shoppingItems.find(s => s.id === itemId);
    if (!item) return;
    const existing = item.photos || [];
    const slots = 3 - existing.length;
    if (slots <= 0) return;
    const files = Array.from(e.target.files).slice(0, slots);
    const photos = [...existing];
    for (const f of files) photos.push({ data: await compressImage(f) });
    item.photos = photos; _shopSave(); renderShopping();
  };
  input.click();
}

function deletePhoto(itemId, photoIdx) {
  const item = shoppingItems.find(s => s.id === itemId);
  if (!item) return;
  const photos = [...(item.photos || [])];
  photos.splice(photoIdx, 1);
  item.photos = photos; _shopSave(); renderShopping();
}

function viewPhoto(itemId, photoIdx) {
  const item = shoppingItems.find(s => s.id === itemId);
  if (!item?.photos?.[photoIdx]) return;
  const ov = document.createElement("div");
  ov.className = "photo-overlay";
  ov.onclick = () => ov.remove();
  ov.innerHTML = `
    <img src="${item.photos[photoIdx].data}" onclick="event.stopPropagation()">
    <button class="photo-overlay-close" onclick="this.closest('.photo-overlay').remove()">✕</button>`;
  document.body.appendChild(ov);
}

// ─── Font Size ────────────────────────────────────────────────────

function updateFontBtns() {
  const level = localStorage.getItem(FONT_KEY) || "md";
  ["md", "lg", "xl"].forEach(l => {
    document.getElementById("hfb-" + l)?.classList.toggle("active", l === level);
  });
}

function setFontSize(level) {
  if (level === "md") {
    document.documentElement.removeAttribute("data-zoom");
  } else {
    document.documentElement.setAttribute("data-zoom", level);
  }
  localStorage.setItem(FONT_KEY, level);
  updateFontBtns();
}

function initFontSize() {
  const saved = localStorage.getItem(FONT_KEY) || "md";
  if (saved !== "md") document.documentElement.setAttribute("data-zoom", saved);
  updateFontBtns();
}

// ─── Render: Shopping ─────────────────────────────────────────────

  }

  shoppingItems.forEach(s => {
    const photos = s.photos || [];
    if (s.id === editingShoppingId) {
      html += `
        <div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px">
          <input class="list-edit-input" id="shop-edit-${s.id}" value="${s.text.replace(/"/g,'&quot;')}"

          <input class="list-edit-input" id="shop-loc-edit-${s.id}" value="${(s.location||'').replace(/"/g,'&quot;')}"
                 placeholder="📍 購買地點（選填）"
                 onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)saveEditShopping(${s.id});if(event.key==='Escape'&&!event.isComposing&&event.keyCode!==229)cancelEditShopping()">
          <div style="display:flex;gap:6px">

            <div class="shop-thumb-wrap">
              <img class="shop-thumb" src="${p.data}">
              <button class="shop-thumb-del" onclick="deletePendingPhoto(${i})">✕</button>
            </div>`).join("")}
          ${pendingShoppingPhotos.length < 3
            ? `<button class="shop-photo-add" onclick="openPendingPhotoPicker()">📷</button>`
            : ""}
        </div>`
      : "";
    html += `
      <div class="shop-add-card">
        <div class="shop-add-title">🆕 新增購物項目</div>

// ─── Render: Meeting ──────────────────────────────────────────────

function renderMeeting() {

  // Firebase not configured → show setup guide
  if (!firebaseReady) {
    el.innerHTML = `
      <div class="setup-card">
        <div class="setup-title">🔔 集合通知</div>
        <div class="setup-sub">設定後，任何人輸入集合時間，大家的手機即時顯示倒數計時。<br>需要 5 分鐘完成 Firebase 免費設定。</div>

        <div class="setup-step">

function relativeTime(ts) {
  const diff = Date.now() - ts;
  const min  = Math.floor(diff / 60000);
  const hr   = Math.floor(diff / 3600000);
  const day  = Math.floor(diff / 86400000);
  if (min < 1)  return "剛才";
  if (min < 60) return `${min} 分鐘前`;
  if (hr  < 24) return `${hr} 小時前`;
  if (day <  7) return `${day} 天前`;
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getDayLabel(day) {
  if (day === 0) return "整趟旅程";
  const d = DAYS.find(x => x.day === day);
  return d ? `第 ${day} 天・${d.date}（${d.wd}）${d.theme}` : `第 ${day} 天`;
}

function getMemberAvatar(name) {
  const m = MEMBERS.find(m => m.name === name);
  return m ? m.avatar : "💬";
}

function renderSettlement(el) {
  let html = `
    <div class="exp-top-row">
      <button class="exp-add-btn" style="flex:1" onclick="expShowSettle=false;renderExpenses()">← 記帳清單</button>
      <button class="exp-settle-btn active" style="flex:1">🧮 結算</button>
    </div>`;

  if (allExpenses.length === 0) {
    html += `<div style="text-align:center;padding:32px 0;color:var(--text-3);font-size:14px">還沒有記帳紀錄</div>`;
    el.innerHTML = html; return;
  }

  ["JPY", "TWD"].forEach(currency => {
    const expenses = allExpenses.filter(e => e.currency === currency);
    if (expenses.length === 0) return;
    const symbol = currency === "JPY" ? "¥" : "$";
    const label  = currency === "JPY" ? "💴 日圓 JPY 結算" : "💵 台幣 TWD 結算";
    const txns   = calcSettlement(expenses);
    const total  = expenses.reduce((s, e) => s + e.amount, 0);

    html += `<div class="settle-card">`;
    html += `<div class="settle-title">${label}・共 ${symbol}${total.toLocaleString()}</div>`;
    if (txns.length === 0) {
      html += `<div class="settle-even">✅ 大家已平衡，不需轉帳</div>`;
    } else {
      txns.forEach(t => {
        html += `
          <div class="settle-row">
            <span class="settle-from">${getMemberAvatar(t.from)} ${t.from}</span>
            <span style="color:var(--text-3);font-size:12px">還給</span>
            <span class="settle-to">${getMemberAvatar(t.to)} ${t.to}</span>
            <span class="settle-amount">${symbol}${t.amount.toLocaleString()}</span>
          </div>`;
      });
    }
    html += `</div>`;
  });

  el.innerHTML = html;
}

function calcSettlement(expenses) {
  const bal = {};
  MEMBERS.forEach(m => { bal[m.name] = 0; });
  expenses.forEach(e => {
    const share = e.amount / e.forWhom.length;
    e.forWhom.forEach(name => { bal[name] = (bal[name] || 0) - share; });
    bal[e.payer] = (bal[e.payer] || 0) + e.amount;
  });
  Object.keys(bal).forEach(k => { bal[k] = Math.round(bal[k]); });

  const creditors = Object.entries(bal).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
  const debtors   = Object.entries(bal).filter(([,v]) => v < 0).sort((a,b) => a[1]-b[1]);
  const txns = [];
  let ci = 0, di = 0;
  while (ci < creditors.length && di < debtors.length) {
    const amount = Math.min(creditors[ci][1], -debtors[di][1]);
    if (amount > 0) txns.push({ from: debtors[di][0], to: creditors[ci][0], amount });
    creditors[ci][1] -= amount;
    debtors[di][1]   += amount;
    if (creditors[ci][1] <= 0) ci++;
    if (debtors[di][1]  >= 0) di++;
  }
  return txns;
}

function submitExpense() {
  if (!expFormPayer)          { alert("請選擇付款人");   return; }

  if (!amount || amount <= 0) { alert("請輸入金額");     return; }
  const note = (document.getElementById("exp-note-input")?.value || "").trim();
  if (!firebaseReady) { alert("目前無法連線，請稍後再試"); return; }
  const payload = {
    currency: expFormCurrency,
    payer:    expFormPayer,
    forWhom:  [...expFormForWhom],
    amount,
    note
  };
  if (expEditKey) {
    _dbRef(EXP_PATH + "/" + expEditKey).update(payload);
  } else {
    _dbRef(EXP_PATH).push({ ...payload, timestamp: Date.now() });
  }
  hideExpForm();
}

function deleteExpense(key) {
  if (!firebaseReady) return;
  if (!confirm("確定刪除這筆記帳？")) return;
  _dbRef(EXP_PATH + "/" + key).remove();
}

// ─── Countdown (trip) ─────────────────────────────────────────────

// Parse user-supplied "M/D" (_CFG.days[].date, meta.endDate) + _CFG.meta.year.
// Returns null if unavailable or unparseable. 倒數徽章與 isPast 共用。
function _parseTripDate(dStr) {
  if (!dStr) return null;
  const dm = /^\s*(\d{1,2})[\/\-.](\d{1,2})\s*$/.exec(dStr);
  if (!dm) return null;
  const year = (_CFG && _CFG.meta && _CFG.meta.year) || new Date().getFullYear();
  return new Date(year, parseInt(dm[1], 10) - 1, parseInt(dm[2], 10));
}

// 旅程「結束」的時間點（晚於這一刻＝已結束）；日期算不出來回傳 null。倒數徽章與 isPast 共用。
function _tripEndBoundary() {
  const days = (_CFG && _CFG.days) || [];
  const meta = (_CFG && _CFG.meta) || {};
  // 結束日以「明確的 meta.endDate」優先，否則才用最後一張日期卡反推。
  // 舊版只用最後一張日期卡：若回程日沒被排成一天（最後一卡是前一天），
  // 就會在表定結束日的凌晨就提早顯示「已結束」。
  let end = meta.endDate ? _parseTripDate(meta.endDate) : null;
  if (!end || isNaN(end)) end = days.length ? _parseTripDate(days[days.length - 1].date) : null;
  if (!end || isNaN(end)) return null;
  // 結束當天整天都算「旅途中」，到當天 23:59 才轉「已結束」；若填了 meta.endTime
  // ("HH:MM")，則以該時刻為準（尊重「表定傍晚結束」這類情況）。
  const endBoundary = new Date(end);
  const et = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(meta.endTime || "");
  if (et) endBoundary.setHours(+et[1], +et[2], 0, 0);
  else    endBoundary.setHours(23, 59, 59, 999);
  return endBoundary;
}

function updateCountdown() {
  const n = document.getElementById("cd-num");
  const l = document.getElementById("cd-label");
  const wrap = n && n.parentElement;
  // If dates are unavailable or unparseable (e.g. user hasn't filled dates yet), hide
  // the badge entirely instead of falling through to a misleading "已結束".
  const days = (_CFG && _CFG.days) || [];
  const start = days.length ? _parseTripDate(days[0].date) : null;
  const endBoundary = _tripEndBoundary();
  if (!start || isNaN(start) || !endBoundary) {
    if (wrap) wrap.style.display = "none";
    return;
  }
  if (wrap) wrap.style.display = "";
  const nowRaw = new Date();
  const nowMid = new Date(nowRaw); nowMid.setHours(0, 0, 0, 0);
  const diff = Math.round((start - nowMid) / 86400000);
  if      (diff > 0)              { n.textContent = diff;     l.textContent = "天後出發"; }
  else if (nowRaw <= endBoundary) { n.textContent = "旅途中"; l.textContent = "🌸"; }
  else                            { n.textContent = "已結束"; l.textContent = "回味中 🫶"; }
}

  });

// ─── PIN Lock ──────────────────────────────────────────────────────
const TRIP_PIN = "__TRIP_PIN__";
let _pinBuf = "";

function initPin() {
  if (!TRIP_PIN || TRIP_PIN === "0000") {
    document.getElementById("pin-overlay").classList.add("hidden");
    return;
  }
  if (sessionStorage.getItem("trip-unlocked") === "1") {
    document.getElementById("pin-overlay").classList.add("hidden");
  } else {
    document.getElementById("pin-overlay").classList.remove("hidden");
  }
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById("pd" + i);
    if (d) d.classList.toggle("filled", i < _pinBuf.length);
  }
}

function pinPress(digit) {
  if (_pinBuf.length >= 4) return;
  _pinBuf += digit;
  updatePinDots();
  if (_pinBuf.length === 4) {
    setTimeout(() => {
      if (_pinBuf === TRIP_PIN) {
        sessionStorage.setItem("trip-unlocked", "1");
        document.getElementById("pin-overlay").classList.add("hidden");
      } else {
        document.getElementById("pin-error").textContent = "PIN 碼錯誤，請再試一次";
        _pinBuf = "";
        updatePinDots();
        const dots = document.getElementById("pin-dots");
        if (dots) { dots.style.transform = "translateX(8px)"; setTimeout(() => dots.style.transform = "", 200); }
      }
    }, 150);
  }
}

function pinBackspace() {
  if (_pinBuf.length > 0) { _pinBuf = _pinBuf.slice(0,-1); updatePinDots(); }
  document.getElementById("pin-error").textContent = "";
}

initPin();
