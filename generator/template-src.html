<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="__THEME_COLOR__">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="__SHORT_TITLE__">
  <title>__TRIP_TITLE__</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:       __THEME_COLOR__;
      --pink-2:     __THEME_ACCENT__;
      --pink-3:     __THEME_LIGHT__;
      --pink-bg:    __BG_COLOR__;
      --pink-pale:  __BG_PALE__;
      --white:      #ffffff;
      --text:       #1e0d12;
      --text-2:     #5c3347;
      --text-3:     #9a7080;
      --border:     #f0d4dc;
      --green:      #3d8a60;
      --amber:      #f59e0b;
      --nav-h:      60px;
    }

    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC",
        "Hiragino Kaku Gothic ProN", "Noto Sans CJK TC", sans-serif;
      background: var(--pink-bg);
      color: var(--text);
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─────────────────────────────────────── */
    .header {
      position: fixed;
      inset: 0 0 auto 0;
      padding-top: env(safe-area-inset-top, 0px);
      background: linear-gradient(145deg, var(--pink) 0%, var(--pink-2) 55%, var(--pink-3) 100%);
      color: white;
      z-index: 100;
    }
    .header-inner { padding: 14px 20px 18px; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .trip-title  { font-size: 21px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.2; display: flex; align-items: center; gap: 9px; }
    .trip-title-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .trip-mark { width: 22px; height: 28px; color: rgba(255,255,255,0.95); flex-shrink: 0; }
    .trip-sub    { font-size: 12px; opacity: 0.85; margin-top: 3px; letter-spacing: 0.04em; }
    .countdown {
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 8px 14px;
      text-align: center;
      flex-shrink: 0;
    }
    .cd-num   { font-size: 26px; font-weight: 900; line-height: 1; }
    .cd-label { font-size: 10px; opacity: 0.9; margin-top: 2px; }
    .header-pills { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .pill {
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 11px;
      font-size: 12px;
    }

    /* ─── Meeting Banner ──────────────────────────────── */
    .meeting-banner {
      display: none;
      position: fixed;
      left: 0; right: 0;
      z-index: 99;
      background: linear-gradient(90deg, #f59e0b, #f97316);
      color: white;
      padding: 10px 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .meeting-banner.visible { display: block; }
    .mb-inner { display: flex; align-items: center; gap: 10px; }
    .mb-icon  { font-size: 22px; flex-shrink: 0; }
    .mb-info  { flex: 1; min-width: 0; }
    .mb-countdown { font-size: 20px; font-weight: 900; line-height: 1; letter-spacing: 0.03em; }
    .mb-sub   { font-size: 12px; opacity: 0.9; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mb-past  { font-size: 13px; font-weight: 700; }
    @keyframes alarm-flash {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .meeting-banner.alarm-flash { animation: alarm-flash 0.45s ease-in-out 8; }

    /* ─── Bottom Nav ──────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      inset: auto 0 0 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(201,75,114,0.09);
    }
    .nav-btn {
      flex: 1; border: none; background: none;
      padding: 10px 0 8px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer; color: var(--text-3); font-size: 10px; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
      position: relative;
    }
    .nav-btn.active { color: var(--pink); }
    .nav-btn.meeting-active { color: var(--amber); }
    .nav-icon { width: 24px; height: 24px; display: block; transition: transform 0.15s; }
    .nav-btn.active .nav-icon { transform: scale(1.1); }
    .nav-dot {
      position: absolute; top: 8px; right: calc(50% - 14px);
      width: 8px; height: 8px;
      background: #ef4444; border-radius: 50%;
      border: 2px solid white;
      display: none;
    }
    .nav-dot.visible { display: block; }

    /* ─── Scroll Content ──────────────────────────────── */
    .content {
      position: fixed;
      inset: 0;
      padding-top: 130px; /* updated by adjustLayout */
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab-panel { display: none; padding: 12px 16px 24px; }
    .tab-panel.active { display: block; }
    #tab-checklist { padding: 0; }
    #tab-checklist-content { padding: 12px 16px 24px; }

    /* ─── Checklist Sub-tabs ──────────────────────────── */
    .checklist-tabs {
      display: flex; gap: 6px;
      padding: 14px 16px 10px; background: var(--bg);
    }
    .checklist-tab-btn {
      flex: 1; padding: 10px 0; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background .15s, color .15s;
      background: var(--pink-pale); color: var(--text-3);
      -webkit-tap-highlight-color: transparent;
    }
    .checklist-tab-btn.active { background: var(--pink); color: #fff; }
    .checklist-tab-btn:active { opacity: .8; }

    /* ─── Section Title ───────────────────────────────── */
    .sec-title {
      font-size: 13px; font-weight: 700; color: var(--text-2);
      letter-spacing: 0.06em; text-transform: uppercase;
      margin: 20px 0 8px;
    }
    .sec-title:first-child { margin-top: 0; }

    /* ─── Day Cards ───────────────────────────────────── */
    .day-card {
      background: white; border-radius: 18px;
      margin-bottom: 10px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(201,75,114,0.09);
    }
    .day-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .day-badge {
      width: 46px; height: 46px; border-radius: 12px;
      background: var(--pink-pale);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .day-badge.is-today { background: var(--pink); }
    .day-badge.is-past  { background: var(--border); }
    .day-num  { font-size: 10px; font-weight: 700; color: var(--pink); line-height: 1; }
    .day-date { font-size: 17px; font-weight: 900; color: var(--pink); line-height: 1.1; }
    .day-badge.is-today .day-num, .day-badge.is-today .day-date { color: white; }
    .day-badge.is-past  .day-num, .day-badge.is-past  .day-date { color: var(--text-3); }
    .day-info { flex: 1; min-width: 0; }
    .day-theme { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .day-meta  { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .day-emoji   { font-size: 22px; flex-shrink: 0; }
    .day-chevron {
      width: 20px; height: 20px; color: var(--text-3);
      transition: transform 0.25s ease; flex-shrink: 0;
    }
    .day-card.open .day-chevron { transform: rotate(180deg); }
    .day-card.is-past { opacity: 0.55; }
    .day-card.is-past .day-theme { color: var(--text-3); }
    .day-card.is-past .day-meta  { color: var(--text-3); }
    .day-header:active { background: rgba(201,75,114,0.06); border-radius: 18px 18px 0 0; }
    .day-body {
      overflow: hidden; max-height: 0;
      transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1);
      border-top: 1px solid transparent;
    }
    .day-card.open .day-body { max-height: 2000px; border-top-color: var(--border); }
    .act-list { padding: 4px 16px 4px; }
    .act-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid #f8f0f3;
    }
    .act-item:last-child { border-bottom: none; }
    .act-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .act-info { flex: 1; min-width: 0; }
    .act-name { font-size: 14px; font-weight: 600; }
    .act-sub  { font-size: 12px; color: var(--text-3); margin-top: 2px; line-height: 1.4; }
    .act-ref  { font-size: 11px; color: var(--text-3); margin-top: 3px; opacity: .8; }
    .act-head { display: flex; align-items: baseline; gap: 8px; }
    .act-head .act-name { flex: 1; min-width: 0; }
    .time-tag {
      font-size: 11px; font-weight: 700; color: var(--pink);
      background: var(--pink-pale); border-radius: 6px; padding: 2px 8px;
      white-space: nowrap; flex-shrink: 0;
    }
    .act-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; position: relative; flex-wrap: wrap; }
    .act-actions-gap { flex: 1 1 auto; min-width: 0; }
    .act-wx-slot { display: inline-flex; align-items: center; min-height: 26px; }
    .map-btn {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--pink-pale); color: var(--pink);
      border: none; border-radius: 8px;
      padding: 8px 12px; min-height: 36px; font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .park-btn { background:#fff; border:1px solid var(--pink-pale); color:var(--pink); }
    .act-menu-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; min-height: 36px; background: #fff; border: 1px solid var(--border);
      color: var(--text-3); border-radius: 8px; font-size: 18px; line-height: 1;
      font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .act-menu {
      position: absolute; right: 0; top: 44px; z-index: 200;
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.13); overflow: hidden; min-width: 124px;
    }
    .act-menu.up { top: auto; bottom: 42px; }
    .act-menu-item {
      display: flex; align-items: center; gap: 8px; width: 100%;
      background: #fff; border: none; padding: 12px 14px;
      font-size: 14px; font-family: inherit; color: var(--text-2);
      cursor: pointer; text-align: left; white-space: nowrap;
    }
    .act-menu-item:active { background: var(--pink-pale); }
    .act-menu-item.danger { color: #dc2626; border-top: 1px solid var(--border); }
    .act-added-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      color: var(--green); background: #e7f5ee; border-radius: 5px;
      padding: 1px 6px; margin-left: 6px; vertical-align: middle;
    }
    .act-edited-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      color: #92400e; background: #fef3c7; border-radius: 5px;
      padding: 1px 6px; margin-left: 6px; vertical-align: middle;
    }
    .slot-edit-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .slot-menu-wrap { position: relative; display: inline-flex; align-items: center; }
    .mini-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: #fff; border: 1px solid var(--border); color: var(--text-2);
      border-radius: 8px; padding: 8px 12px; min-height: 36px;
      font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mini-btn.danger { color: #dc2626; border-color: #f3c9c9; }
    .slot-add-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; background: #fff; border: 1px dashed var(--border);
      color: var(--text-3); border-radius: 10px; padding: 12px;
      font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
      margin-top: 8px; -webkit-tap-highlight-color: transparent;
    }
    .slot-add-btn:active { background: var(--pink-pale); }
    .undo-toast {
      position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px);
      transform: translateX(-50%) translateY(16px); z-index: 200;
      display: flex; align-items: center; gap: 12px;
      background: #1e0d12; color: #fff; border-radius: 12px;
      padding: 12px 12px 12px 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.28);
      max-width: calc(100% - 32px); opacity: 0; pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .undo-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .undo-toast-msg { font-size: 14px; font-weight: 500; }
    .share-updated-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      color: #dc2626; background: #fef2f2; border-radius: 20px;
      padding: 2px 8px; margin-left: 6px; vertical-align: middle;
    }
    .undo-toast-btn {
      background: transparent; border: none; color: var(--pink-3);
      font-weight: 800; font-size: 14px; font-family: inherit; cursor: pointer;
      padding: 6px 8px; white-space: nowrap; -webkit-tap-highlight-color: transparent;
    }
    .trash-section { margin: 4px 16px 20px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; }
    .trash-header {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      background: var(--pink-pale); border: none; padding: 12px 14px;
      font-size: 13px; font-weight: 700; color: var(--text-2); font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .trash-count {
      display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
      background: var(--pink); color: #fff; border-radius: 9px; font-size: 11px; text-align: center;
    }
    .trash-caret { color: var(--text-3); font-size: 11px; }
    .trash-list { padding: 2px 0; }
    .trash-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); }
    .trash-icon { font-size: 18px; flex-shrink: 0; }
    .trash-info { flex: 1; min-width: 0; }
    .trash-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trash-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .trash-restore-btn {
      flex-shrink: 0; background: var(--pink-pale); color: var(--pink); border: none;
      border-radius: 8px; padding: 8px 12px; min-height: 36px;
      font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .trash-foot { padding: 8px 14px 12px; font-size: 11px; color: var(--text-3); }
    .itin-add-row { padding: 2px 16px 12px; }
    .itin-add-btn {
      width: 100%; background: var(--pink-pale); color: var(--pink);
      border: 1px dashed var(--pink); border-radius: 10px;
      padding: 12px; font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .day-share-row { padding: 6px 16px 14px; }
    .day-share-btn {
      width: 100%; background: #fff; color: var(--pink);
      border: 1px solid var(--pink); border-radius: 10px;
      padding: 12px; font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .day-share-btn:active { background: var(--pink-pale); }
    .showcase-entry-row { padding: 10px 16px 4px; }
    .showcase-entry-btn {
      width: 100%; background: var(--pink-pale); color: var(--pink);
      border: 1px dashed var(--pink); border-radius: 10px;
      padding: 12px; font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .showcase-entry-btn:active { background: var(--pink-3); }
    .day-hotel {
      margin: 0 16px 14px; background: var(--pink-bg);
      border-radius: 10px; padding: 10px 12px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .day-hotel-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .day-hotel-info { flex: 1; min-width: 0; }
    .day-hotel-name { font-size: 13px; font-weight: 600; color: var(--text-2); }
    .day-hotel-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
    .day-hotel-note { font-size: 11px; color: var(--text-3); }
    .hotel-paid-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600;
      border-radius: 5px; padding: 1px 6px;
    }
    .hotel-paid-badge.paid   { color: #15803d; background: #dcfce7; }
    .hotel-paid-badge.unpaid { color: #92400e; background: #fef3c7; }

    /* ─── Weather Capsule ─────────────────────────────── */
    .weather-capsule {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600;
      background: #e0f2fe; color: #0369a1;
      border-radius: 6px; padding: 2px 7px;
    }
    .weather-capsule-wrap {
      display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .weather-source-tag {
      font-size: 9px; font-weight: 700; letter-spacing: 0.03em;
      border-radius: 4px; padding: 1px 5px; line-height: 1.6;
    }
    .weather-source-tag.historical { background: #f3f4f6; color: #6b7280; }
    .weather-source-tag.forecast   { background: #dbeafe; color: #1d4ed8; }
    .weather-capsule.pending { background: #f3f4f6; color: #6b7280; font-weight: 600; }
    .weather-capsule.loading { background: #f3f4f6; color: #9ca3af; }
    /* 地名信心提示：此地點是用不精確的地名估算天氣，點一下（title）看說明 */

    /* ─── Parking Section ─────────────────────────────── */
    .parking-section {
      margin: 0 16px 14px;
      background: #eff6ff;
      border-radius: 10px;
      padding: 12px;
    }
    .parking-header {
      font-size: 12px; font-weight: 700; color: #1d4ed8;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 8px;
    }
    .parking-lot {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 0; border-bottom: 1px solid #dbeafe;
    }
    .parking-lot:last-of-type { border-bottom: none; }
    .parking-lot.warn { opacity: 0.6; }
    .parking-left { flex: 1; min-width: 0; }
    .parking-name { font-size: 13px; font-weight: 600; color: #1e3a5f; }
    .parking-note { font-size: 11px; color: #64748b; margin-top: 2px; line-height: 1.4; }
    .parking-search-btn {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      width: 100%; margin-top: 10px;
      background: #1d4ed8; color: white;
      border: none; border-radius: 8px;
      padding: 10px; font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer; text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .parking-search-btn:active { opacity: 0.85; }

    /* ─── Restaurant Section ──────────────────────────── */
    .restaurant-section {
      margin: 0 16px 14px;
      background: #fff7ed;
      border-radius: 10px;
      padding: 12px;
    }
    .restaurant-header {
      font-size: 12px; font-weight: 700; color: #c2410c;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 8px;
    }
    .restaurant-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 0; border-bottom: 1px solid #fed7aa;
    }
    .restaurant-item:last-child { border-bottom: none; }
    .restaurant-left { flex: 1; min-width: 0; }
    .restaurant-name { font-size: 13px; font-weight: 600; color: #7c2d12; }
    .restaurant-note { font-size: 11px; color: #9a6a50; margin-top: 2px; line-height: 1.4; }

    /* ─── Flights & Hotels ────────────────────────────── */
    .flight-card {
      background: white; border-radius: 16px;
      padding: 16px; margin-bottom: 10px;
      box-shadow: 0 2px 10px rgba(201,75,114,0.08);
    }
    .flight-label { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
    .flight-row { display: flex; align-items: center; justify-content: space-between; }
    .f-port.right { text-align: right; }
    .f-code { font-size: 28px; font-weight: 900; color: var(--text); }
    .f-city { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .f-time { font-size: 20px; font-weight: 700; color: var(--pink); margin-top: 5px; }
    .f-mid  { text-align: center; flex: 1; padding: 0 10px; }
    .f-num  { font-size: 11px; font-weight: 600; color: var(--text-3); }
    .f-plane { font-size: 22px; margin: 4px 0; }
    .hotel-card {
      background: white; border-radius: 16px;
      padding: 16px; margin-bottom: 10px;
      box-shadow: 0 2px 10px rgba(201,75,114,0.08);
    }
    .hotel-nights { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .night-badge {
      font-size: 11px; font-weight: 700; color: white;
      background: var(--pink-2); border-radius: 6px; padding: 3px 8px;
    }
    .night-badge.dark { background: var(--text-2); }
    .hotel-name { font-size: 15px; font-weight: 700; }
    .hotel-loc  { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .hotel-pay  { font-size: 12px; color: var(--text-3); margin-top: 6px; }
    .hotel-pay.paid { color: var(--green); font-weight: 600; }
    .hotel-row  { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }

    /* ─── Members & Notes ─────────────────────────────── */
    .member-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .member-card {
      background: white; border-radius: 14px;
      padding: 12px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 8px rgba(201,75,114,0.07);
    }
    .m-avatar {
      width: 42px; height: 42px; border-radius: 10px;
      background: linear-gradient(135deg, var(--pink-pale), var(--pink-3));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .m-name { font-size: 14px; font-weight: 700; }
    .note-item {
      position: relative;
      background: white; border-radius: 12px;
      padding: 12px 14px; margin-bottom: 7px;
      display: flex; align-items: flex-start; gap: 10px;
      box-shadow: 0 1px 6px rgba(201,75,114,0.06);
      font-size: 13px; line-height: 1.6;
    }
    .note-item-body { flex: 1; min-width: 0; }
    .note-add-btn {
      width: 100%; margin-top: 10px; padding: 11px;
      background: var(--pink-pale); border: 1.5px dashed var(--pink);
      color: var(--pink); border-radius: 12px; font-size: 14px;
      font-family: inherit; cursor: pointer; font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    .note-icon { flex-shrink: 0; font-size: 16px; margin-top: 1px; }

    /* ─── Custom / Shopping Items ─────────────────────── */
    .list-item {
      display: flex; align-items: center; gap: 8px;
      background: white; border-radius: 12px; padding: 11px 12px;
      margin-bottom: 6px;
      box-shadow: 0 1px 6px rgba(201,75,114,0.06);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .list-item.done { opacity: 0.55; }
    .list-item.done .list-label { text-decoration: line-through; }
    .list-label { flex: 1; font-size: 14px; color: var(--text); }
    .list-check {
      width: 22px; height: 22px; flex-shrink: 0;
      border-radius: 6px; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .list-item.done .list-check { background: var(--green); border-color: var(--green); }
    .list-check-mark { display: none; color: white; font-size: 12px; font-weight: 800; }
    .list-item.done .list-check-mark { display: block; }
    .del-btn {
      width: 28px; height: 28px; flex-shrink: 0;
      border: none; border-radius: 7px;
      background: #fee2e2; color: #dc2626;
      font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .add-row {
      display: flex; gap: 8px; margin-top: 8px;
    }
    .add-row input {
      flex: 1; padding: 11px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 15px; font-family: inherit; color: var(--text);
      background: white; outline: none;
    }
    .add-row input:focus { border-color: var(--pink); }
    .add-row-btn {
      border: none; border-radius: 10px;
      background: var(--pink); color: white;
      padding: 11px 16px; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .add-trigger {
      width: 100%; margin-top: 8px;
      border: 1.5px dashed var(--border); border-radius: 12px;
      background: white; color: var(--text-3);
      padding: 12px; font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── Shopping: Photos & Location ─────────────────── */
    .shop-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .shop-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; align-self: flex-start; }
    .shop-location { font-size: 11px; color: var(--text-3); }
    .shop-photos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .shop-thumb-wrap { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
    .shop-thumb {
      width: 60px; height: 60px; object-fit: cover;
      border-radius: 8px; border: 1px solid var(--border); cursor: pointer; display: block;
    }
    .shop-thumb-del {
      position: absolute; top: -5px; right: -5px;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(0,0,0,.6); color: white; border: none;
      font-size: 10px; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .shop-photo-add {
      width: 60px; height: 60px; border-radius: 8px;
      border: 1.5px dashed var(--border); background: var(--pink-pale);
      font-size: 22px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; font-family: inherit;
    }
    .shop-photo-add-inline {
      font-size: 11px; color: var(--text-3); background: none; border: none;
      cursor: pointer; padding: 1px 0; font-family: inherit; text-align: left;
    }
    .add-row-col { flex-direction: column; gap: 6px; }
    .add-row-col input { width: 100%; box-sizing: border-box; }
    .add-row-buttons { display: flex; gap: 8px; }
    /* 新增購物項目表單：做成明顯有別於清單列的「卡片」，避免使用者以為沒按成功、
       或把「購買地點」欄誤當成另一筆商品來填。 */
    .shop-add-card {
      background: var(--pink-pale);
      border: 1.5px solid var(--pink);
      border-radius: 14px;
      padding: 12px 12px 14px;
      margin-top: 10px;
      display: flex; flex-direction: column; gap: 6px;
      box-shadow: 0 3px 12px rgba(201,75,114,0.14);
    }
    .shop-add-title {
      font-size: 13px; font-weight: 800; color: var(--pink);
      display: flex; align-items: center; gap: 5px; margin-bottom: 2px;
    }
    .shop-field-label {
      font-size: 11px; font-weight: 700; color: var(--text-2);
      margin: 3px 0 -2px 2px;
    }
    .shop-add-input {
      width: 100%; box-sizing: border-box; padding: 11px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 15px; font-family: inherit; color: var(--text);
      background: white; outline: none;
    }
    .shop-add-input:focus { border-color: var(--pink); }
    /* Photo full-screen viewer */
    .photo-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.88);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .photo-overlay img { max-width: 95vw; max-height: 85vh; border-radius: 10px; object-fit: contain; }
    .photo-overlay-close {
      position: absolute; top: 16px; right: 16px;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,.18); border: none; color: white;
      font-size: 20px; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
    }

    /* ─── Meeting Tab ─────────────────────────────────── */

    /* Empty state */
    .meeting-empty {
      text-align: center;
      padding: 48px 24px 32px;
    }
    .meeting-empty-icon { font-size: 64px; line-height: 1; margin-bottom: 12px; }
    .meeting-empty-text { font-size: 16px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
    .meeting-empty-sub  { font-size: 13px; color: var(--text-3); }

    /* Active meeting display */
    .meeting-active-card {
      background: linear-gradient(135deg, #fffbeb, #fff7ed);
      border: 1.5px solid #fcd34d;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 12px;
    }
    .meeting-label { font-size: 13px; font-weight: 700; color: #92400e; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
    .meeting-clock {
      font-size: 52px; font-weight: 900;
      color: #d97706; letter-spacing: 0.04em;
      line-height: 1; font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
    }
    .meeting-clock.passed { color: var(--text-3); font-size: 28px; }
    .meeting-time-row {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 14px; font-weight: 700; color: #92400e; margin-bottom: 8px;
    }
    .meeting-msg  { font-size: 15px; color: var(--text-2); margin-bottom: 8px; line-height: 1.5; }
    .meeting-by   { font-size: 12px; color: var(--text-3); }

    /* Form */
    .meeting-form-card {
      background: white; border-radius: 18px;
      padding: 20px 16px; margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(201,75,114,0.09);
    }
    .form-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .form-row   { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; letter-spacing: 0.04em; }
    .form-input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 16px; font-family: inherit; color: var(--text);
      background: white; outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--amber); }
    .form-actions { display: flex; gap: 8px; margin-top: 4px; }
    .hint { font-size: 12px; color: var(--text-3); margin-top: 6px; line-height: 1.5; }
    /* 地點欄位：貼 Google 地圖分享連結 */
    .btn.map-find-btn {
      width: 100%; margin-top: 8px; padding: 10px 14px; font-size: 14px;
      background: white; color: var(--text-2); border: 1.5px solid var(--border);
    }
    .map-status { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--text-3); overflow-wrap: anywhere; }
    .map-status.ok { color: #2f6b34; font-weight: 700; }
    .map-status.warn { color: #b45309; }
    .map-status .geo-verify-link { margin-top: 4px; }
    .geo-pinned {
      display: flex; align-items: center; gap: 10px;
      background: #eef7ee; border: 1.5px solid #bfe0bf; border-radius: 12px;
      padding: 10px 14px;
    }
    .geo-pinned-txt { flex: 1; font-size: 13px; color: #2f6b34; line-height: 1.5; }
    .geo-clear-btn {
      flex: none; border: none; background: #fee2e2; color: #dc2626;
      font-family: inherit; font-size: 12px; font-weight: 700;
      border-radius: 8px; padding: 6px 12px; cursor: pointer;
    }
    .geo-verify-link {
      display: inline-block; margin-top: 8px;
      font-size: 13px; font-weight: 700; color: var(--pink);
      text-decoration: none;
    }
    .geo-verify-link:active { opacity: 0.7; }

    /* Buttons */
    .btn {
      border: none; border-radius: 12px;
      padding: 13px 18px; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary {
      flex: 1; background: var(--amber); color: white;
    }
    .btn-outline {
      background: white; color: var(--text-2);
      border: 1.5px solid var(--border);
    }
    .btn-danger {
      background: #fee2e2; color: #dc2626;
    }
    .btn-pink {
      flex: 1; background: var(--pink); color: white;
    }

    /* Action row below active meeting */
    .meeting-actions { display: flex; gap: 8px; }

    /* Firebase setup instructions */
    .setup-card {
      background: white; border-radius: 18px;
      padding: 20px; margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(201,75,114,0.09);
    }
    .setup-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; color: var(--text); }
    .setup-sub   { font-size: 13px; color: var(--text-3); margin-bottom: 18px; line-height: 1.5; }
    .setup-step  {
      display: flex; gap: 12px; align-items: flex-start;
      margin-bottom: 14px;
    }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--pink); color: white;
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .step-text { font-size: 13px; line-height: 1.6; color: var(--text-2); }
    .step-text a { color: var(--pink); text-decoration: none; font-weight: 600; }
    .step-code {
      font-family: monospace; font-size: 12px;
      background: var(--pink-bg); border-radius: 6px;
      padding: 8px 10px; margin-top: 6px;
      color: var(--text-2); line-height: 1.7;
      white-space: pre-wrap; word-break: break-all;
    }

    .msg-form-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .msg-form-title { font-size: 18px; font-weight: 800; color: var(--text); }
    .msg-close-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--pink-bg); border: none;
      font-size: 16px; color: var(--text-3);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* Day picker pills */
    .day-picker { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; }
    .day-picker::-webkit-scrollbar { display: none; }
    .day-pill {
      flex-shrink: 0;
      padding: 8px 13px; border-radius: 10px; border: 1.5px solid var(--border);
      background: white; color: var(--text-2);
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .day-pill.selected { background: var(--pink); color: white; border-color: var(--pink); }

    /* Member picker */
    .member-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .member-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--border);
      background: white; color: var(--text-2);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .member-pill.selected { background: var(--pink); color: white; border-color: var(--pink); }

    /* ─── Day Transport Mini Card ───────────────────────── */
    .day-transport-card {
      margin: 0 16px 14px;
      border-radius: 10px;
      padding: 11px 12px;
    }
    .dtc-flight { background: linear-gradient(135deg, #eef2ff, #e0e7ff); }
    .dtc-car    { background: linear-gradient(135deg, #f0fdf4, #dcfce7); }
    .dtc-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 7px;
    }
    .dtc-flight .dtc-label { color: #4338ca; }
    .dtc-car    .dtc-label { color: #15803d; }
    .dtc-flight-row { display: flex; align-items: center; }
    .dtc-port { text-align: center; }
    .dtc-code { font-size: 19px; font-weight: 900; color: #1e3a5f; }
    .dtc-city { font-size: 10px; color: #64748b; }
    .dtc-time { font-size: 14px; font-weight: 700; color: #4338ca; margin-top: 2px; }
    .dtc-mid  { flex: 1; text-align: center; padding: 0 6px; }
    .dtc-num  { font-size: 11px; color: #64748b; }
    .dtc-arrow { font-size: 16px; margin: 2px 0; }
    .dtc-car-text { font-size: 13px; font-weight: 600; color: #15803d; }
    .dtc-car-sub  { font-size: 11px; color: #16a34a; margin-top: 3px; line-height: 1.5; }

    /* ─── Font Size ─────────────────────────────────────── */
    html[data-zoom="lg"] { zoom: 1.2; }
    html[data-zoom="xl"] { zoom: 1.4; }

    .header-font-row {
      display: flex; align-items: center; gap: 6px;
      margin-top: 10px;
    }
    .hdr-font-label { font-size: 11px; opacity: 0.8; color: white; }
    .hdr-font-btn {
      border: none; border-radius: 7px;
      background: rgba(255,255,255,0.18); color: white;
      padding: 4px 11px; font-size: 12px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .hdr-font-btn.active { background: rgba(255,255,255,0.48); }

    /* ─── Expenses Tab ──────────────────────────────────── */
    .exp-top-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .exp-add-btn {
      flex: 2; background: var(--pink); color: white;
      border: none; border-radius: 14px;
      padding: 14px; font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 3px 12px rgba(201,75,114,0.3);
    }
    .exp-add-btn:active { opacity: 0.85; }
    .exp-settle-btn {
      flex: 1; background: white; color: var(--pink);
      border: 1.5px solid var(--pink); border-radius: 14px;
      padding: 14px; font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .exp-settle-btn.active { background: var(--pink); color: white; }

    .exp-currency-header {
      font-size: 12px; font-weight: 700; color: var(--text-2);
      letter-spacing: 0.06em; margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .exp-currency-header::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    .exp-card {
      background: white; border-radius: 14px;
      padding: 13px 15px; margin-bottom: 7px;
      box-shadow: 0 2px 8px rgba(201,75,114,0.08);
      display: flex; align-items: center; gap: 10px;
    }
    .exp-card-left { flex: 1; min-width: 0; }
    .exp-payer { font-size: 15px; font-weight: 700; color: var(--text); }
    .exp-for   { font-size: 12px; color: var(--text-3); margin-top: 2px; line-height: 1.4; }
    .exp-note  { font-size: 12px; color: var(--text-3); margin-top: 1px; }
    .exp-amount { font-size: 18px; font-weight: 900; color: var(--pink); white-space: nowrap; text-align: right; }
    .exp-del-btn {
      width: 28px; height: 28px; flex-shrink: 0;
      border: none; border-radius: 7px;
      background: #fee2e2; color: #dc2626;
      font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .settle-card {
      background: white; border-radius: 16px;
      padding: 20px 18px; margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(201,75,114,0.09);
    }
    .settle-title {
      font-size: 13px; font-weight: 700; color: var(--text-2);
      letter-spacing: 0.06em; margin-bottom: 12px;
    }
    .settle-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .settle-row:last-child { border-bottom: none; }
    .settle-from   { font-weight: 700; color: #dc2626; }
    .settle-to     { font-weight: 700; color: var(--green); }
    .settle-amount { margin-left: auto; font-weight: 900; font-size: 16px; color: var(--text); }
    .settle-even   { text-align: center; padding: 16px; font-size: 14px; color: var(--green); font-weight: 700; }

    .currency-toggle { display: flex; gap: 7px; }
    .currency-btn {
      flex: 1; padding: 10px; border-radius: 10px;
      border: 1.5px solid var(--border);
      background: white; color: var(--text-2);
      font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent; text-align: center;
    }
    .currency-btn.selected { background: var(--pink); color: white; border-color: var(--pink); }

    .for-whom-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .select-all-btn {
      width: 100%; padding: 9px; border-radius: 10px;
      border: 1.5px dashed var(--border);
      background: white; color: var(--text-3);
      font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 6px;
    }

    /* ─── Edit Controls ─────────────────────────────────── */
    .edit-btn {
      width: 28px; height: 28px; flex-shrink: 0;
      border: none; border-radius: 7px;
      background: #e0f2fe; color: #0369a1;
      font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .list-edit-input {
      flex: 1; padding: 6px 10px;
      border: 1.5px solid var(--pink); border-radius: 8px;

<script>
// ─── Trip Config (generated) ─────────────────────────────────────
const _CFG = __TRIP_CONFIG__;

const DAYS           = _CFG.days;
const HOTELS         = _CFG.hotels;
const MEMBERS        = _CFG.members;
const NOTES          = _CFG.notes;
const CHECKLIST      = _CFG.checklist;
const RESTAURANTS    = _CFG.restaurants;
/* injected by generator: */ const _CFG_PRESET_SHOPPING = _CFG.presetShopping;
const REMOVED_PRESETS = _CFG.removedPresets || [];
const WEATHER_LOCS   = _CFG.weatherLocs;

const FIREBASE_CONFIG = _CFG.firebase;
const _PFX    = _CFG.meta.storagePrefix;
const DB_PATH  = _PFX + "/meeting";
const EXP_PATH  = _PFX + "/expenses";
const ITIN_PATH  = _PFX + "/itinerary";
const NOTES_PATH = _PFX + "/notes";
const CHECK_KEY = _PFX + "-check-v1";

// ─── App State ────────────────────────────────────────────────────

let openDays       = new Set();
let checked        = new Set(JSON.parse(localStorage.getItem(CHECK_KEY) || "[]"));
let currentMeeting = null;
let countdownTimer = null;
let alarmFiredForTime = null; // track which meeting time has already triggered the alarm
let showForm       = false;
let firebaseReady  = false;

let allExpenses     = [];
let expFormCurrency = "JPY";
let expFormPayer    = "";
let expFormForWhom  = new Set(MEMBERS.map(m => m.name));
let expShowSettle   = false;
let expEditKey      = null;

let itinAdded   = [];   // [{_key, day, icon, name, sub, time, map, by, timestamp}]
let itinHidden  = {};   // { "<day>_<presetIndex>": true } — removed preset acts
let itinFormDay = 1;
let itinFormIcon = "📍";
let itinEdited     = {};   // { "<day>_<presetIndex>": {icon,name,sub,time,map} } — preset overrides
let itinEditTarget = null; // null=新增 | {kind:"added",key} | {kind:"preset",pid}
let itinFormSeed   = { name:"", time:"", sub:"", map:"" };
let itinMenuKey    = null; // id of the act whose ⋯ menu is open
let hotelEdited  = {}, hotelHidden  = {};     // 住宿：每日覆寫 / 隱藏
let hotelFormDay  = null, hotelFormSeed  = {}, hotelFormPaid = false;
let notesAdded   = [];      // [{_key, icon, text}] — Firebase/localStorage added
let notesEdited  = {};      // {idx: {icon,text}} — preset overrides
let notesHidden  = {};      // {idx: true} — hidden presets
let noteMenuKey  = null;    // "p:idx" | "a:key" | null
let noteEditTarget = null;  // null=新增 | {kind:"preset",idx} | {kind:"added",key}
let noteFormSeed = { icon: "⚠️", text: "" };
let _undoFn = null, _undoTimer = null;         // 刪除 → 復原
let itinTrash = [], trashOpen = false;          // 最近刪除（保留 30 天可復原）

let editingShoppingId  = null;
let editingCheckId     = null;

const CUSTOM_CHECK_KEY  = _PFX + "-custom-check-v1";
const CHECK_HIDDEN_KEY  = _PFX + "-check-hidden-v1";  // {idx: true} — 隱藏的固定行前清單項目
const CHECK_EDITED_KEY  = _PFX + "-check-edited-v1";  // {idx: text} — 固定項目的文字覆寫
const SHOPPING_KEY      = _PFX + "-shopping-v1";
const FONT_KEY          = _PFX + "-font-size";

const PRESET_SHOPPING = _CFG_PRESET_SHOPPING || [];
const SHOPPING_INIT_KEY = _PFX + "-shopping-init-" + btoa(unescape(encodeURIComponent(JSON.stringify(PRESET_SHOPPING)))).slice(0, 8);
let customChecks  = JSON.parse(localStorage.getItem(CUSTOM_CHECK_KEY) || "[]");
let checklistHidden = JSON.parse(localStorage.getItem(CHECK_HIDDEN_KEY) || "{}");
let checklistEdited = JSON.parse(localStorage.getItem(CHECK_EDITED_KEY) || "{}");
let shoppingItems;
if (!localStorage.getItem(SHOPPING_INIT_KEY)) {
  shoppingItems = PRESET_SHOPPING.map((item, i) => ({
    id: 1000 + i,
    text:     typeof item === 'string' ? item : (item.name  || ''),
    location: typeof item === 'string' ? ''   : (item.place || ''),
    bought: false
  }));
  localStorage.setItem(SHOPPING_KEY, JSON.stringify(shoppingItems));
  localStorage.setItem(SHOPPING_INIT_KEY, "1");
} else {
  shoppingItems = JSON.parse(localStorage.getItem(SHOPPING_KEY) || "[]");
  // 一次性清理：移除已刪除的預設項目（不影響使用者自行新增的項目）
  const before = shoppingItems.length;
  shoppingItems = shoppingItems.filter(s => !REMOVED_PRESETS.some(kw => s.text.includes(kw)));
  if (shoppingItems.length !== before) localStorage.setItem(SHOPPING_KEY, JSON.stringify(shoppingItems));
}
let showCheckInput        = false;
let showShoppingInput     = false;
let checklistSubTab       = "shopping";
let pendingShoppingPhotos = [];

// ─── Firebase availability (gates collab-only tabs) ───────────────
const FB_ENABLED = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("YOUR"));
const QUICK_SHARE = !!(_CFG._quickShare);
function applyFirebaseAvailability() {
  if (FB_ENABLED) return;
  if (QUICK_SHARE) {
    // 一行連結模式：集合 & 記帳不支援，直接隱藏 nav tab
    const mBtn = document.getElementById('nav-meeting');
    const eBtn = document.getElementById('nav-expenses');
    if (mBtn) mBtn.style.display = 'none';
    if (eBtn) eBtn.style.display = 'none';
    return;
  }
  // 進階模式但尚未設定 Firebase：顯示設定引導
  renderMeeting();
  renderExpenses();
}

// ─── Firebase Init ────────────────────────────────────────────────

// ─── Storage shim: itinerary works with Firebase (synced) OR localStorage (local) ──
// Advanced mode → Firebase (multi-person sync). Minimum mode (no Firebase, e.g. the
// /v/ share link) → localStorage on this device only; edits never leave the device.
function _makeLocalItinStore(suffix) {
  const KEY = _PFX + "-" + (suffix || "itin") + "-local-v1";
  let data; try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { data = {}; }
  const listeners = []; // { path, cb }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const seg = p => String(p || "").split("/").filter(Boolean);
  const getAt = p => { let n = data; for (const s of seg(p)) { if (n == null) return null; n = n[s]; } return n === undefined ? null : n; };
  const setAt = (p, v) => {
    const a = seg(p); let n = data;
    for (let i = 0; i < a.length - 1; i++) { if (typeof n[a[i]] !== "object" || n[a[i]] == null) n[a[i]] = {}; n = n[a[i]]; }
    if (v === null || v === undefined) delete n[a[a.length - 1]]; else n[a[a.length - 1]] = v;
  };
  const fire = changed => listeners.forEach(l => {
    if (changed.indexOf(l.path) === 0 || l.path.indexOf(changed) === 0) l.cb({ val: () => getAt(l.path) });
  });
  return function ref(sub) {
    return {
      on: (ev, cb) => { listeners.push({ path: sub, cb }); setTimeout(() => cb({ val: () => getAt(sub) }), 0); },
      set: v => { setAt(sub, v); save(); fire(sub); return Promise.resolve(); },
      update: v => { const cur = getAt(sub) || {}; setAt(sub, Object.assign({}, cur, v)); save(); fire(sub); return Promise.resolve(); },
      remove: () => { setAt(sub, null); save(); fire(sub); return Promise.resolve(); },
      push: v => { const k = "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); setAt(sub + "/" + k, v); save(); fire(sub); return { key: k }; },
    };
  };
}
let _localItin = null, _localNotes = null;
function _dbRef(path) {
  if (FB_ENABLED) return firebase.database().ref(path);
  if (path === ITIN_PATH || path.lastIndexOf(ITIN_PATH + "/", 0) === 0) {
    if (!_localItin) _localItin = _makeLocalItinStore();
    return _localItin(path === ITIN_PATH ? "" : path.slice(ITIN_PATH.length + 1));
  }
  if (path === NOTES_PATH || path.lastIndexOf(NOTES_PATH + "/", 0) === 0) {
    if (!_localNotes) _localNotes = _makeLocalItinStore("notes");
    return _localNotes(path === NOTES_PATH ? "" : path.slice(NOTES_PATH.length + 1));
  }
  // meeting / expenses are Firebase-only; their tabs are hidden without Firebase
  return { on() {}, set() { return Promise.resolve(); }, update() { return Promise.resolve(); }, remove() { return Promise.resolve(); }, push() { return { key: null }; } };
}

function initFirebase() {
  if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("YOUR")) return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    
    _dbRef(DB_PATH).on("value", snap => {
      const prev = currentMeeting;

// ─── Countdown Logic ──────────────────────────────────────────────

function calcCountdown(timeStr) {
  const [h, m] = timeStr.split(":").map(Number);
  const now    = new Date();
  const target = new Date(now);
  target.setHours(h, m, 0, 0);
  if (target <= now) return null; // passed
  const diff = target - now;
  const hh   = Math.floor(diff / 3600000);
  const mm   = Math.floor((diff % 3600000) / 60000);
  const ss   = Math.floor((diff % 60000) / 1000);
  return { hh, mm, ss };
}

function fmtCountdown(c) {
  if (!c) return "已過集合時間";
  const pad = n => String(n).padStart(2, "0");
  return `${pad(c.hh)}:${pad(c.mm)}:${pad(c.ss)}`;
}

function startCountdownTick() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    if (!currentMeeting) return;
    const c = calcCountdown(currentMeeting.time);

    // Update banner
    const bannerCD = document.getElementById("banner-countdown");
    if (bannerCD) bannerCD.textContent = c ? `距集合 ${fmtCountdown(c)}` : "已過集合時間";

    // Update meeting tab clock (if visible)
    const clock = document.getElementById("meeting-clock");
    if (clock) {
      clock.textContent = fmtCountdown(c);
      clock.className   = "meeting-clock" + (c ? "" : " passed");
    }

    // Trigger alarm once when countdown first reaches zero
    if (!c && alarmFiredForTime !== currentMeeting.time) {
      alarmFiredForTime = currentMeeting.time;
      triggerAlarm();
    }
  }, 1000);
}

// ─── Banner ───────────────────────────────────────────────────────

function updateMeetingBanner() {
  const banner = document.getElementById("meeting-banner");
  const dot    = document.getElementById("meeting-dot");

  if (!currentMeeting) {
    banner.classList.remove("visible");
    dot.classList.remove("visible");
    document.getElementById("banner-countdown").textContent = "";
    document.getElementById("banner-sub").textContent = "";
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    return;
  }

  banner.classList.add("visible");
  dot.classList.add("visible");

  const c = calcCountdown(currentMeeting.time);
  document.getElementById("banner-countdown").textContent = c ? `距集合 ${fmtCountdown(c)}` : "已過集合時間";

  let sub = `${currentMeeting.time} 集合`;
  if (currentMeeting.message) sub += `・${currentMeeting.message}`;
  document.getElementById("banner-sub").textContent = sub;

  startCountdownTick();
}

// ─── Alarm ────────────────────────────────────────────────────────

function playAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (startTime, dur) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.7, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
      osc.start(startTime);
      osc.stop(startTime + dur);
    };
    const t = ctx.currentTime;
    beep(t,       0.25);
    beep(t + 0.35, 0.25);
    beep(t + 0.70, 0.25);
    beep(t + 1.10, 0.55);
  } catch (e) {}
}

function triggerAlarm() {
  playAlarm();
  if ("vibrate" in navigator) {
    navigator.vibrate([400, 200, 400, 200, 600]);
  }
  const banner = document.getElementById("meeting-banner");
  if (banner) {
    banner.classList.remove("alarm-flash");
    void banner.offsetWidth; // force reflow so re-adding class re-triggers animation
    banner.classList.add("alarm-flash");
    banner.addEventListener("animationend", () => banner.classList.remove("alarm-flash"), { once: true });
  }
  // Show system notification if page is in background
  if (typeof Notification !== "undefined" && Notification.permission === "granted" && currentMeeting) {
    const body = currentMeeting.message || "現在出發！";
    new Notification("🔔 集合時間到！", { body, tag: "meeting-alarm", requireInteraction: true });
  }
}

async function requestNotifPermission() {
  if (typeof Notification === "undefined") return;
  if (Notification.permission === "default") {
    await Notification.requestPermission();
  }
}

async function scheduleAlarmNotif(timeStr, message) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const [h, m] = timeStr.split(":").map(Number);
  const target = new Date();
  target.setHours(h, m, 0, 0);
  const timestamp = target.getTime();
  if (timestamp <= Date.now()) return;

  // Try Notification Triggers API (Chrome Android)
  if (typeof TimestampTrigger !== "undefined" && navigator.serviceWorker) {
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.getNotifications({ tag: "meeting-alarm" });
      existing.forEach(n => n.close());
      await reg.showNotification("🔔 集合時間到！", {
        body: message || "現在出發！",
        showTrigger: new TimestampTrigger(timestamp),
        vibrate: [400, 200, 400, 200, 600],
        requireInteraction: true,
        tag: "meeting-alarm"
      });
      return;
    } catch (e) {}
  }

  // Fallback: ask SW to schedule via setTimeout (works while browser is open)
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: "SCHEDULE_ALARM", timestamp, message: message || "現在出發！"
    });
  }
}

async function cancelAlarmNotif() {
  if (navigator.serviceWorker) {
    try {
      const reg = await navigator.serviceWorker.ready;
      const notifs = await reg.getNotifications({ tag: "meeting-alarm" });
      notifs.forEach(n => n.close());
    } catch (e) {}
  }
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: "CANCEL_ALARM" });
  }
}

// ─── Helpers ──────────────────────────────────────────────────────

function mapUrl(q) {
  if (q && q.startsWith("http")) return q;
  return "https://maps.google.com/?q=" + encodeURIComponent(q);
}
function parkTerm() { return (_CFG.meta && _CFG.meta.parkingTerm) || "parking"; }
// 停車場搜尋字串：優先用使用者實際 pin 的位置（連結中的 q= 參數或座標），
// 避免「駐車場 + 繁體中文景點名」混語在當地地圖搜不到；都取不到才退回名稱。
function parkQuery(a) {
  const map = (a && a.map) || "";
  if (/^https?:\/\//i.test(map)) {
    try {
      const u = new URL(map);
      const qp = u.searchParams.get("q") || u.searchParams.get("query");
      if (qp && qp.trim()) return qp.trim();
    } catch (e) {}
    const at = map.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    if (at) return at[1] + "," + at[2];
    const dd = map.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
    if (dd) return dd[1] + "," + dd[2];
    return (a && a.name) || "";
  }
  return map || (a && a.name) || "";
}
// 交通類活動（搭機/搭車/搭船）不需要找停車場
function isTransit(icon) { return /[✈🚄🚅🚃🚆🚇🚈🚝🛫🛬🚢⛴🚤]/u.test(icon || ""); }
function isTodayDate(ds) {
  const [m, d] = ds.split("/").map(Number);
  const date = new Date(_CFG.meta.year, m-1, d);
  const now  = new Date();
  return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
}
function isPast(ds) {
  // 旅程整個結束後全部恢復正常顯示，不再整頁變灰；「結束」的時間點與倒數徽章同一套（_tripEndBoundary）
  const tripEnd = _tripEndBoundary();
  if (tripEnd && new Date() > tripEnd) return false;
  const [m, d] = ds.split("/").map(Number);
  const date   = new Date(_CFG.meta.year, m-1, d);
  const now    = new Date(); now.setHours(0,0,0,0);
  return date < now;
}

  45:"🌫", 48:"🌫",
  51:"🌦", 53:"🌦", 55:"🌧",

  95:"⛈", 96:"⛈", 99:"⛈",
};

function wmoIcon(code) { return WMO_ICON[code] || "🌡"; }

// ─── Weather Capsule (per-activity location) ───────────────────────

// 天氣只用「使用者明確指定的地點」：geo 精確座標，或讀得出位置的 Google 地圖連結。
// 地名文字一律不查（2026-09 起）：拿地名丟地理編碼會落在不相干但看似正常的地點
//（實測「早餐」查到別的城市的餐廳），程式無法分辨對錯。沒有自己地點的景點沿用當天其他地點。
const _WX_CACHE  = {};        // "lat,lon" → { "M/D": { daily, hours } }
const _DAY_WX_FALLBACK = {};  // d.date → 當天第一個有位置的 "lat,lon"
// 天氣還在載入中（展開短網址＋抓天氣跑完前）：讓已知有地點的景點顯示「載入中」而非直接空白，
// 避免使用者誤以為天氣功能不見了（實際上只是還沒跑完）。
let   _wxLoading = true;
// 舊版用地名查座標的快取，已不再使用：清掉，不佔使用者裝置空間
try { localStorage.removeItem(`${_PFX}_geoCache_v2`); localStorage.removeItem(`${_PFX}_geoCache`); } catch(e) {}

// ─── Google 地圖分享短網址（maps.app.goo.gl）→ 完整網址 ─────────────
// 短網址本身不含位置，要看它轉址到哪裡；瀏覽器讀不到跨網站轉址的目標，
// 所以交給旅人手帖網站上的伺服器小程式代讀。每條短網址成功讀過一次就存在裝置上，不再重讀。
// 使用者自己部署的進階版 App 也呼叫同一支（純靜態上傳無法自帶伺服器小程式）。
const MAP_LINK_API = (/(^|\.)claire-cheng\.com$|(^|--)trip-v2\.netlify\.app$/.test(location.hostname)
  ? "" : "https://trips.claire-cheng.com") + "/.netlify/functions/expand-map-link";
const _SHORT_MAP_RE = /^https:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps)\/[A-Za-z0-9_-]+\/?(?:\?[A-Za-z0-9_=&%.-]*)?$/;
function _isShortMapLink(s) { return _SHORT_MAP_RE.test(String(s || "").trim()); }
const _LINK_CACHE_KEY = `${_PFX}_mapLinkCache_v1`;
const _LINK_CACHE = (() => {   // 短網址 → 完整網址（只存成功的）
  try { return JSON.parse(localStorage.getItem(_LINK_CACHE_KEY)) || {}; } catch(e) { return {}; }
})();
const _LINK_TRIED = new Set();  // 本次開啟已經試過但失敗的短網址：不在同一次開啟裡反覆重試
const _LINK_INFLIGHT = {};      // 短網址 → 進行中的 Promise（同一條同時只送一次）

// 完整網址的 /maps/place/ 形式：去掉追蹤用查詢參數（entry、g_ep、skid…），位置與名稱都在路徑裡
function _cleanMapUrl(u) {
  return /\/maps\/place\//.test(u) ? u.split("?")[0] : u;
}

// 展開一條短網址：成功回傳完整網址（並存進裝置），失敗回傳 null。
function _expandMapLink(short) {
  short = String(short || "").trim();
  if (_LINK_CACHE[short]) return Promise.resolve(_LINK_CACHE[short]);
  if (_LINK_INFLIGHT[short]) return _LINK_INFLIGHT[short];
  const p = (async () => {
    try {
      const r = await fetch(`${MAP_LINK_API}?u=${encodeURIComponent(short)}`);
      const d = r.ok ? await r.json() : null;
      if (!d || !d.url) { _LINK_TRIED.add(short); return null; }
      _LINK_CACHE[short] = _cleanMapUrl(d.url);
      try { localStorage.setItem(_LINK_CACHE_KEY, JSON.stringify(_LINK_CACHE)); } catch(e) {}
      return _LINK_CACHE[short];
    } catch(e) { _LINK_TRIED.add(short); return null; }
    finally { delete _LINK_INFLIGHT[short]; }
  })();
  _LINK_INFLIGHT[short] = p;
  return p;
}

// 地點欄位字串 → 實際可解析的字串：已展開過的短網址換成完整網址，其餘原樣
function _resolveMapStr(s) {
  const t = String(s || "").trim();
  return (_isShortMapLink(t) && _LINK_CACHE[t]) || t;
}

// 從 Google 地圖完整網址讀出地點名稱（/maps/place/<名稱>/…）；讀不到回傳空字串
function _mapPlaceName(u) {
  const m = /\/maps\/place\/([^/?#]+)/.exec(u || "");
  if (!m) return "";
  try { return decodeURIComponent(m[1].replace(/\+/g, " ")).trim(); } catch(e) { return ""; }
}

// 地點欄位的狀態，給表單顯示用：
//   empty 沒填／text 只有文字／pending 短網址還沒讀／failed 短網址讀不到／noplace 連結沒有指向單一地點／ok 已定位
function _mapLinkInfo(s) {
  const raw = String(s || "").trim();
  if (!raw) return { status: "empty" };
  if (_normGeo(raw)) return { status: "ok", name: "", url: mapUrl(raw) };
  if (!/^https?:\/\//i.test(raw)) return { status: "text" };
  if (_isShortMapLink(raw) && !_LINK_CACHE[raw]) return { status: _LINK_TRIED.has(raw) ? "failed" : "pending" };
  const full = _resolveMapStr(raw);
  if (!_placeLatLon(full)) return { status: "noplace" };
  return { status: "ok", name: _mapPlaceName(full), url: full };
}

// 從 Google Maps 連結解析「使用者實際 pin 的座標」，讓天氣抓的是那個確切位置。優先序：
//   !3d<lat>!4d<lon>（地點精確標記，最準）> @<lat>,<lon>（地圖視野中心）
//   > ?q=/query=/ll=/center= 裡的「純座標值」。解析不到座標回傳 null。
// maps.app.goo.gl 短網址要先經 _resolveMapStr 換成展開後的完整網址。
function _extractLatLon(mapStr) {
  if (!mapStr || !/^https?:\/\//i.test(mapStr)) return null;
  const ok = (la, lo) => (isFinite(la) && isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180)
    ? { lat: la, lon: lo } : null;
  // !3d=緯度、!4d=經度（Google 的地點精確標記）。獨立比對，不假設兩者的前後順序。
  const d3 = mapStr.match(/!3d(-?\d+(?:\.\d+)?)/);
  const d4 = mapStr.match(/!4d(-?\d+(?:\.\d+)?)/);
  if (d3 && d4) { const r = ok(parseFloat(d3[1]), parseFloat(d4[1])); if (r) return r; }
  const at = mapStr.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (at) { const r = ok(parseFloat(at[1]), parseFloat(at[2])); if (r) return r; }
  // 查詢參數裡的「純座標值」：逐一檢查 q/query/ll/center，回傳第一個是座標的
  //（?q= 可能是地名，但同一網址的 ?ll= 常是座標，別因為 q 是名字就漏掉）。
  try {
    const u = new URL(mapStr);
    for (const k of ['q', 'query', 'll', 'center']) {
      const cand = u.searchParams.get(k);
      const c = cand && cand.match(/^\s*(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (c) { const r = ok(parseFloat(c[1]), parseFloat(c[2])); if (r) return r; }
    }
  } catch(e) {}
  return null;
}

// 把精確座標（geo 欄位）正規化成 "lat,lon" 查詢鍵；非合法座標回傳 null。
// 資料模型乙：活動可獨立存 geo 欄位，與 map（名字／連結）並存。
function _normGeo(geo) {
  if (geo == null) return null;
  const m = /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/.exec(String(geo));
  if (!m) return null;
  const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
  return (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) ? `${lat},${lon}` : null;
}

// 地點 → 天氣查詢鍵 "lat,lon"；沒有使用者指定的位置就回傳 null（不再以地名猜測）
function _extractGeoQuery(mapStr, geo) {
  const g = _normGeo(geo);                     // ① geo 精確座標最優先
  if (g) return g;
  const plain = _normGeo(mapStr);              // ② 地點欄位本身就是 "lat,lon"
  if (plain) return plain;
  const ll = _placeLatLon(_resolveMapStr(mapStr));    // ③ 連結裡的位置（短網址用展開後的）
  return ll ? `${ll.lat},${ll.lon}` : null;
}

// 連結指向的「單一地點」位置。搜尋結果／路線連結裡的 @lat,lon 只是地圖畫面的中心，
// 不代表使用者選了哪個地點 → 不採用（仍可採用這類連結裡明確的座標參數）。
function _placeLatLon(u) {
  if (/\/maps\/(search|dir)\//.test(u || "")) u = String(u).replace(/@-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?[^/?]*/, "");
  return _extractLatLon(u);
}

// "lat,lon" 查詢鍵 → { lat, lon }
function _latLonOf(q) {
  const k = _normGeo(q);
  if (!k) return null;
  const [lat, lon] = k.split(",").map(Number);
  return { lat, lon };
}

// Open-Meteo 免費 API 每個 IP 同時只處理 1 個請求，其餘排隊，排隊超過 5 個就回 429
// "Too many concurrent requests"（維護者說明：github.com/open-meteo/open-meteo/issues/1650）。
// 同一個 Wi-Fi 的旅伴、其他分頁也會佔排隊名額 → 遇到 429 稍等再試，最多重試 2 次。
async function _wxFetch(url) {
  for (let attempt = 0; ; attempt++) {
    const r = await fetch(url);
    if (r.status !== 429 || attempt >= 2) return r;
    await new Promise(res => setTimeout(res, 2000 * (attempt + 1)));
  }
}

async function _fetchWxRange(lat, lon, start, end, isArchive) {
  const base = isArchive
    ? 'https://archive-api.open-meteo.com/v1/archive'
    : 'https://api.open-meteo.com/v1/forecast';
  // archive API has no precipitation_probability; use precipitation_sum instead
  const dailyVars = isArchive
    ? 'temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code'
    : 'temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code';
  const hourlyVars = isArchive
    ? 'temperature_2m,precipitation,weather_code'
    : 'temperature_2m,precipitation_probability,weather_code';
  const url = `${base}?latitude=${lat}&longitude=${lon}` +
    `&hourly=${hourlyVars}&daily=${dailyVars}` +
    `&start_date=${start}&end_date=${end}&timezone=auto`;
  try {
    const r = await _wxFetch(url); if (!r.ok) return;
    const data = await r.json();
    const key = `${lat},${lon}`;
    if (!_WX_CACHE[key]) _WX_CACHE[key] = {};
    (data.daily?.time || []).forEach((iso, i) => {
      const [mm, dd] = iso.slice(5).split('-');
      const mmdd = `${parseInt(mm)}/${parseInt(dd)}`;
      if (!_WX_CACHE[key][mmdd]) _WX_CACHE[key][mmdd] = { hours: {}, daily: null };
      const rainKey = isArchive ? 'precipitation_sum' : 'precipitation_probability_max';
      _WX_CACHE[key][mmdd].daily = {
        max:  Math.round(data.daily.temperature_2m_max[i]),
        min:  Math.round(data.daily.temperature_2m_min[i]),
        rain: +(data.daily[rainKey]?.[i] ?? 0).toFixed(1),
        isArchive,
        code: data.daily.weather_code[i],
      };
    });
    (data.hourly?.time || []).forEach((t, i) => {
      const [date, hm] = t.split('T');
      const h = parseInt(hm);
      const [mm2, dd2] = date.slice(5).split('-');
      const mmdd = `${parseInt(mm2)}/${parseInt(dd2)}`;
      if (!_WX_CACHE[key][mmdd]) _WX_CACHE[key][mmdd] = { hours: {}, daily: null };
      const rainKey = isArchive ? 'precipitation' : 'precipitation_probability';
      _WX_CACHE[key][mmdd].hours[h] = {
        temp: Math.round(data.hourly.temperature_2m[i]),
        rain: +(data.hourly[rainKey]?.[i] ?? 0).toFixed(1),
        isArchive,
        code: data.hourly.weather_code[i],
      };
    });
  } catch(e) { console.warn('[weather]', e.message); }
}

function _rainStr(w) {
  if (!w || w.rain == null) return '';
  return w.isArchive ? ` ${w.rain}mm` : ` 雨${w.rain}%`;
}

// 收集「每個日期要查天氣的地點」：用畫面上實際呈現的內容——原始行程＋旅伴新增＋修改覆寫，
// 扣掉刪除的（_dayMergedActs／_dayHotelInfo），住宿也算，當作當天沒有地點的景點的天氣依據。
function _dayPlaces(d) {
  const out = _dayMergedActs(d).map(a => ({ map: a.map, geo: a.geo }));
  const h = _dayHotelInfo(d);
  if (h) out.push({ map: h.map, geo: h.geo });
  return out;
}
function _weatherQueriesByDate() {
  const byDate = {};                       // "M/D" → Set("lat,lon")
  DAYS.forEach(d => {
    _dayPlaces(d).forEach(p => {
      const q = _extractGeoQuery(p.map, p.geo);
      if (q) (byDate[d.date] || (byDate[d.date] = new Set())).add(q);
    });
  });
  return byDate;
}
// 還沒展開、本次開啟也還沒試過的短網址
function _pendingShortLinks() {
  const out = new Set();
  DAYS.forEach(d => _dayPlaces(d).forEach(p => {
    const t = String(p.map || "").trim();
    if (!_normGeo(p.geo) && _isShortMapLink(t) && !_LINK_CACHE[t] && !_LINK_TRIED.has(t)) out.add(t);
  }));
  return [...out];
}

let _wxRunning = false;   // 避免重入
let _wxDirty   = false;   // 執行期間又有新增 → 跑完再補一輪

async function loadWeatherCapsules() {
  // 旅伴的新增／修改由 Firebase 非同步同步進來，可能在第一輪跑完後才到；用 dirty flag 讓
  // 「執行期間新增的地點」在本輪結束後自動再補抓，不會被漏掉。
  if (_wxRunning) { _wxDirty = true; return; }
  _wxRunning = true;
  try {
    do { _wxDirty = false; await _runWeatherPass(); } while (_wxDirty);
  } finally { _wxRunning = false; }
}

async function _runWeatherPass() {
  // 先把舊資料裡的分享短網址展開（每條只讀一次，結果存在裝置上）
  const pending = _pendingShortLinks();
  if (pending.length) await Promise.all(pending.map(_expandMapLink));

  const byDate = _weatherQueriesByDate();
  // 每天的 fallback（當天第一個有位置的地點）：給當天沒有自己地點的活動借用天氣
  Object.keys(_DAY_WX_FALLBACK).forEach(k => { if (!byDate[k]) delete _DAY_WX_FALLBACK[k]; });
  Object.keys(byDate).forEach(date => { _DAY_WX_FALLBACK[date] = [...byDate[date]][0]; });
  const uniqueQ = [...new Set(Object.values(byDate).flatMap(s => [...s]))];
  if (!uniqueQ.length) { _wxLoading = false; renderItinerary({ cardsOnly: true }); return; }

  const coordRange = {};
  Object.entries(byDate).forEach(([date, qs]) => {
    const isoDate = dateToISO(date);
    [...qs].forEach(k => {
      if (!coordRange[k]) coordRange[k] = { min: isoDate, max: isoDate };
      if (isoDate < coordRange[k].min) coordRange[k].min = isoDate;
      if (isoDate > coordRange[k].max) coordRange[k].max = isoDate;
    });
  });

  const cutISO = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
  // 歷史天氣（archive）一次送一個：伺服器每個 IP 本來就一次只處理一個（見 _wxFetch），
  // 以前跟預報一起同時送出，21 個地點的示範頁會被 429 擋掉約一半。
  // 預報 API 回得快、實測同時 21 個都成功 → 維持同時送，出發前看天氣的速度不變。
  // 已經抓過的座標與日期不重抓（旅伴新增／修改地點後只補新的）。
  const archiveJobs = [];   // 先收集，下面一個一個送
  const forecastPs  = [];   // 立刻同時送
  Object.entries(coordRange).forEach(([k, { min, max }]) => {
    const { lat, lon } = _latLonOf(k);
    const have = _WX_CACHE[`${lat},${lon}`];
    if (have && have[_isoToMD(min)] && have[_isoToMD(max)]) return;
    if (min <= cutISO) archiveJobs.push(() => _fetchWxRange(lat, lon, min, max <= cutISO ? max : cutISO, true));
    if (max >  cutISO) forecastPs.push(_fetchWxRange(lat, lon, min >  cutISO ? min : cutISO, max, false));
  });
  await Promise.all([
    (async () => { for (const job of archiveJobs) await job(); })(),
    ...forecastPs,
  ]);

  _wxLoading = false;
  renderItinerary();
}

// "2026-04-15" → "4/15"（_WX_CACHE 的日期鍵）
function _isoToMD(iso) { return `${parseInt(iso.slice(5, 7))}/${parseInt(iso.slice(8, 10))}`; }

// 旅伴新增／修改景點或住宿後補抓天氣：只有出現「還沒展開的短網址」或
// 「還沒抓過天氣的位置」才重跑；已抓過的直接沿用，通常很快。
function refreshWeather() {
  if (_pendingShortLinks().length) { loadWeatherCapsules(); return; }
  const byDate = _weatherQueriesByDate();
  const needs = Object.entries(byDate).some(([date, qs]) =>
    [...qs].some(q => { const c = _latLonOf(q); return !(_WX_CACHE[`${c.lat},${c.lon}`] || {})[date]; })
    || _DAY_WX_FALLBACK[date] !== [...qs][0]);
  if (needs) loadWeatherCapsules();
}

function getWeatherCapsule(mapStr, dayDate, timeStr, fallbackQ, actIdx, geo) {
  const [m, dy] = dayDate.split('/').map(Number);
  const dateMidnight = new Date(_CFG.meta.year, m - 1, dy);
  const todayMid = new Date(); todayMid.setHours(0, 0, 0, 0);
  // open-meteo 預報只到出發當日 +約 16 天；更遠的行程還沒有資料 →
  // 顯示佔位說明（每天只標一次，掛在當天第一個活動），避免靜默消失讓人以為壞了。
  const horizon = new Date(todayMid); horizon.setDate(horizon.getDate() + 16);
  if (dateMidnight > horizon) {
    return actIdx ? '' : `<span class="weather-capsule-wrap"><span class="weather-capsule pending">⏳ 出發前約兩週才有天氣</span></span>`;
  }
  const q = _extractGeoQuery(mapStr, geo) || fallbackQ;
  if (!q) return '';
  // 還在展開短網址／抓天氣的過程中：顯示「載入中」而非空白，避免使用者以為功能不見了。
  // 流程跑完（_wxLoading=false）後若仍查不到，才真的顯示成沒有天氣。
  const _loadingCapsule = `<span class="weather-capsule-wrap"><span class="weather-capsule loading">⏳</span></span>`;
  const geoRes = _latLonOf(q);
  if (!geoRes) return '';
  const wxKey = `${geoRes.lat},${geoRes.lon}`;
  const dayData = _WX_CACHE[wxKey]?.[dayDate];
  if (!dayData) return _wxLoading ? _loadingCapsule : '';

  const isHistorical = dateMidnight < todayMid;
  const srcTag = isHistorical
    ? `<span class="weather-source-tag historical">歷史資料</span>`
    : `<span class="weather-source-tag forecast">預報</span>`;

  let w;
  if (timeStr && dayData.hours) {
    const h = parseInt(timeStr.split(':')[0]);
    // 只取逐時資料；時間填「夜」「上午」這類非時:分格式時 h 是 NaN、查不到，
    // 要落到下方 daily 區塊用最低–最高溫。退回 daily 物件會因為它沒有 temp 而印出 undefined°。
    w = dayData.hours[h] || dayData.hours[h + 1];
    if (w) return `<span class="weather-capsule-wrap"><span class="weather-capsule">${wmoIcon(w.code)} ${w.temp}°${_rainStr(w)}</span>${srcTag}</span>`;
  }
  w = dayData.daily;
  if (!w) return '';
  return `<span class="weather-capsule-wrap"><span class="weather-capsule">${wmoIcon(w.code)} ${w.min}–${w.max}°${_rainStr(w)}</span>${srcTag}</span>`;
}

// 將 "4/15" → "2026-04-15"
function dateToISO(d) {
  const [m, day] = d.split("/");
  return `${_CFG.meta.year}-${m.padStart(2,"0")}-${day.padStart(2,"0")}`;
}

// ─── Render: Itinerary ────────────────────────────────────────────

// 景點時間轉成當天的分鐘數。不是「時:分」開頭的（沒填、或「夜」「上午」）回傳 -1，視為沒有時間。
function _timeMin(s) {
  const m = String(s || "").match(/^\s*(\d{1,2}):(\d{2})/);
  return m ? +m[1] * 60 + +m[2] : -1;
}

// ↓ _insertByTime／_minimalTimeOrder 與 generator-app.js 的同名函式必須逐字相同，產生器畫面才會等於輸出順序
function _insertByTime(list, row, minOf) {
  const m = minOf(row);
  const at = m < 0 ? -1 : list.findIndex(x => minOf(x) > m);
  if (at < 0) list.push(row); else list.splice(at, 0, row);
}
// 只移動時間放錯的列：保留「最多列已照時間排好」的那組不動（同樣多時保留排在前面的），
// 其餘有時間的列插回第一個比它晚的列之前；沒時間的列跟著原本的前後鄰居，不動。
function _minimalTimeOrder(rows, minOf) {
  const pos = [], t = [];
  rows.forEach((r, i) => { const m = minOf(r); if (m >= 0) { pos.push(i); t.push(m); } });
  const best = t.map(() => 1);
  for (let i = t.length - 2; i >= 0; i--)
    for (let k = i + 1; k < t.length; k++) if (t[k] >= t[i] && best[k] + 1 > best[i]) best[i] = best[k] + 1;
  const keep = new Set();
  let need = t.length ? Math.max(...best) : 0, last = -1;
  for (let i = 0; i < t.length && need > 0; i++) {
    if (best[i] === need && (last < 0 || t[i] >= t[last])) { keep.add(pos[i]); last = i; need--; }
  }
  const out = rows.filter((r, i) => minOf(r) < 0 || keep.has(i));
  rows.forEach((r, i) => {
    const m = minOf(r);
    if (m < 0 || keep.has(i)) return;
    let at = out.findIndex(x => minOf(x) > m);
    // 沒有更晚的列：放在最後一個有時間的列之後，不要排到尾端沒時間的列後面
    if (at < 0) { at = out.length; for (let j = out.length - 1; j >= 0; j--) if (minOf(out[j]) >= 0) { at = j + 1; break; } }
    out.splice(at, 0, r);
  });
  return out;
}
// 產生器排好的景點（含航班）套用同一規則；App 裡新增的、以及在 App 裡改成另一個時間的景點，
// 再逐筆插在第一個比它晚的景點前（沒時間就接在最後）。
function _orderDayActs(presetActs, addedActs) {
  const minOf = a => _timeMin(a.time);
  const list = _minimalTimeOrder(presetActs.filter(a => !a._timeMoved), minOf);
  presetActs.filter(a => a._timeMoved).concat(addedActs).forEach(f => _insertByTime(list, f, minOf));
  return list;
}

// 單日行程分享（圖卡）與 renderItinerary 共用同一份「當天合併後景點」邏輯，
// 抽成獨立函式避免兩處各算一次而彼此不同步。
function _dayMergedActs(d) {
  const _presetActs = d.acts
    .map((a, i) => {
      const _pid = a.id || (d.day + "_" + i);
      const _ov  = itinEdited[_pid];
      const _newMin = _ov ? _timeMin(_ov.time) : -1;
      const _timeMoved = _newMin >= 0 && _newMin !== _timeMin(a.time);
      return { ...a, ...(_ov || {}), _src: "preset", _pid: _pid, _origIdx: i, _edited: !!_ov, _timeMoved };
    })
    .filter(a => !itinHidden[a._pid]);
  const _addedActs = itinAdded
    .filter(a => a.day === d.day)
    .map(a => ({ ...a, _src: "added" }));
  return _orderDayActs(_presetActs, _addedActs);
}

// 同上，抽出「當天住宿」的合併邏輯（preset + 覆寫 + 隱藏）供分享圖卡共用。
function _dayHotelInfo(d) {
  return hotelHidden[d.day] ? null
    : ((d.hotel || hotelEdited[d.day]) ? Object.assign({}, d.hotel || {}, hotelEdited[d.day] || {}) : null);
}

function renderItinerary(opts) {
  opts = opts || {};
  const html  = DAYS.map(d => {
    const isOpen  = openDays.has(d.day);
    const isToday = isTodayDate(d.date);
    const past    = isPast(d.date) && !isToday;

    const _wxFallback = _DAY_WX_FALLBACK[d.date] || null;
    const _mergedActs = _dayMergedActs(d);
    const _canEdit = firebaseReady;
    const actsHtml = _mergedActs.map(a => {
      const _added = a._src === "added";
      const _userVal = _added || a._edited; // 使用者輸入需跳脫；原始 config 信任
      const _id  = _added ? ("a:" + a._key) : ("p:" + a._pid);
      // 天氣膠囊維持「每天首個景點才顯示」：新增項與非首項回傳空字串
      const _wx  = getWeatherCapsule(a.map, d.date, a.time, _wxFallback, _added ? 1 : a._origIdx, a.geo);
      const _mapBtn  = a.map ? `<a class="map-btn" href="${mapUrl(a.map)}" target="_blank" rel="noopener">📍 地圖</a>` : "";
      const _parkBtn = (d.selfDrive && (a.map || a.name) && !isTransit(a.icon) && a.park !== false)
        ? `<a class="map-btn park-btn" href="${mapUrl(parkTerm() + " " + parkQuery(a))}" target="_blank" rel="noopener">🅿️ 停車</a>` : "";
      const _menu = _canEdit ? `
          <button class="act-menu-btn" aria-label="更多操作" onclick="event.stopPropagation();toggleItinMenu('${_id}')">⋯</button>
          ${itinMenuKey === _id ? `<div class="act-menu">
            <button class="act-menu-item" onclick="startEditItin('${_id}')">✏️ 編輯</button>
            <button class="act-menu-item danger" onclick="${_added ? `deleteItinAct('${a._key}')` : `hideItinAct('${a._pid}')`}">🗑 刪除</button>
          </div>` : ""}` : "";
      const _hasActions = _wx || _mapBtn || _parkBtn || _menu;
      const _actions = _hasActions ? `
          <div class="act-actions">
            ${_wx ? `<span class="act-wx-slot">${_wx}</span>` : ""}
            <span class="act-actions-gap"></span>
            ${_mapBtn}${_parkBtn}${_menu}
          </div>` : "";
      const _nm = _userVal ? _esc(a.name) : a.name;
      const _badge = _added
        ? `<span class="act-added-badge">旅伴新增${a.by ? "・" + _esc(a.by) : ""}</span>`
        : (a._edited ? `<span class="act-edited-badge">已修改</span>` : "");
      return `
      <div class="act-item">
        <span class="act-icon">${a.icon || "📍"}</span>
        <div class="act-info">
          <div class="act-head">
            <div class="act-name">${_nm}${_badge}</div>
            ${a.time ? `<span class="time-tag">${a.time}</span>` : ""}
          </div>
          ${a.sub ? `<div class="act-sub">${_userVal ? _esc(a.sub) : a.sub}</div>` : ""}
          ${a.ref ? `<div class="act-ref">📋 ${a.ref}</div>` : ""}
          ${_actions}
        </div>
      </div>`;
    }).join("");

    const _hotel = _dayHotelInfo(d);
    const hotelHtml = _hotel ? (() => {
      const _hMapBtn  = _hotel.map ? `<a class="map-btn" href="${mapUrl(_hotel.map)}" target="_blank" rel="noopener">📍 地圖</a>` : "";
      const _hParkBtn = (d.selfDrive && _hotel.name && _hotel.park !== false)
        ? `<a class="map-btn park-btn" href="${mapUrl(parkTerm() + " " + parkQuery(_hotel))}" target="_blank" rel="noopener">🅿️ 停車</a>` : "";
      const _hMenu = _canEdit ? `<span class="slot-menu-wrap">
          <button class="act-menu-btn" aria-label="更多操作" onclick="event.stopPropagation();toggleItinMenu('hotel:${d.day}')">⋯</button>
          ${itinMenuKey === "hotel:" + d.day ? `<div class="act-menu">
            <button class="act-menu-item" onclick="startEditHotel(${d.day})">✏️ 編輯</button>
            <button class="act-menu-item danger" onclick="deleteHotel(${d.day})">🗑 刪除</button>
          </div>` : ""}
        </span>` : "";
      const _hActions = (_hMapBtn || _hParkBtn || _hMenu) ? `
          <div class="act-actions">
            <span class="act-actions-gap"></span>
            ${_hMapBtn}${_hParkBtn}${_hMenu}
          </div>` : "";
      return `
      <div class="day-hotel">
        <span class="day-hotel-icon">🏨</span>
        <div class="day-hotel-info">
